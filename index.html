<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0a0e13">
<title>IQC AI — Giriş Kalite Kontrol</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#0a0e13; --surface:#131b24; --surface2:#1a2430; --surface3:#212d3a;
  --border:#23303e; --border2:#2e3d4e;
  --text:#e8eef6; --muted:#8496ab; --muted2:#5f7285;
  --accent:#00d1b2; --accent-d:#00a88f; --blue:#3b82f6;
  --ok:#22c55e; --nok:#ef4444; --warn:#f59e0b;
  --r:16px; --r-sm:10px;
}
html,body{height:100%}
body{
  background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  font-size:15px;line-height:1.45;overscroll-behavior:none;
  -webkit-font-smoothing:antialiased;
}
#app{display:flex;flex-direction:column;height:100dvh;max-width:600px;margin:0 auto;position:relative;background:var(--bg);overflow:hidden}

/* ---------- TOPBAR ---------- */
#topbar{
  display:flex;align-items:center;gap:10px;
  padding:calc(12px + env(safe-area-inset-top)) 14px 12px;
  border-bottom:1px solid var(--border);
  background:linear-gradient(180deg,#101a24,#0c131a);
  position:relative;z-index:30;flex-shrink:0;
}
#topbar .tb-title{font-size:16px;font-weight:700;letter-spacing:.2px;flex:1;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#topbar .tb-sub{font-size:11px;color:var(--muted);font-weight:500;letter-spacing:.3px}
.iconbtn{
  width:36px;height:36px;border-radius:11px;border:1px solid var(--border);
  background:var(--surface);color:var(--text);display:flex;align-items:center;justify-content:center;
  cursor:pointer;flex-shrink:0;transition:.15s;
}
.iconbtn:active{background:var(--surface3);transform:scale(.94)}
.iconbtn svg{width:19px;height:19px}

/* ---------- SCREEN ---------- */
#screen{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:16px 14px 28px;min-height:0}
body.cam #screen{padding:0;overflow:hidden}
body.cam #tabbar{display:none}

/* ---------- TABBAR ---------- */
#tabbar{
  display:flex;border-top:1px solid var(--border);background:#0c131a;
  padding-bottom:env(safe-area-inset-bottom);flex-shrink:0;
}
#tabbar button{
  flex:1;background:none;border:0;color:var(--muted2);padding:8px 0 9px;
  font-size:10px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:3px;
  cursor:pointer;font-family:inherit;transition:.15s;letter-spacing:.2px;
}
#tabbar button svg{width:21px;height:21px}
#tabbar button.active{color:var(--accent)}
#tabbar button:active{transform:scale(.93)}

/* ---------- COMMON ---------- */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:14px;margin-bottom:12px}
.card.tight{padding:11px 13px}
.sec-title{font-size:11.5px;font-weight:700;color:var(--muted);letter-spacing:1.1px;
  text-transform:uppercase;margin:18px 2px 9px}
.sec-title:first-child{margin-top:2px}
.row{display:flex;align-items:center;gap:10px}
.between{display:flex;align-items:center;justify-content:space-between;gap:10px}
.muted{color:var(--muted)}
.small{font-size:12.5px}
.tiny{font-size:11px}
.mono{font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace}
.badge{display:inline-flex;align-items:center;gap:4px;padding:3px 8px;border-radius:7px;
  font-size:10.5px;font-weight:700;letter-spacing:.4px;text-transform:uppercase}
.badge.ok{background:rgba(34,197,94,.14);color:#4ade80;border:1px solid rgba(34,197,94,.28)}
.badge.nok{background:rgba(239,68,68,.14);color:#f87171;border:1px solid rgba(239,68,68,.28)}
.badge.wait{background:rgba(245,158,11,.14);color:#fbbf24;border:1px solid rgba(245,158,11,.28)}
.badge.info{background:rgba(59,130,246,.14);color:#7dabf8;border:1px solid rgba(59,130,246,.28)}
.badge.gray{background:rgba(132,150,171,.12);color:var(--muted);border:1px solid var(--border2)}
.badge.ai{background:rgba(0,209,178,.13);color:var(--accent);border:1px solid rgba(0,209,178,.3)}

.btn{
  display:flex;align-items:center;justify-content:center;gap:8px;width:100%;
  padding:14px;border-radius:13px;border:1px solid var(--border2);background:var(--surface2);
  color:var(--text);font-size:14.5px;font-weight:650;font-family:inherit;cursor:pointer;
  transition:.15s;letter-spacing:.2px;
}
.btn:active{transform:scale(.98);background:var(--surface3)}
.btn svg{width:18px;height:18px}
.btn.primary{background:linear-gradient(135deg,var(--accent),var(--accent-d));border-color:transparent;color:#04211c;font-weight:750}
.btn.primary:active{filter:brightness(.92)}
.btn.danger{background:rgba(239,68,68,.14);border-color:rgba(239,68,68,.4);color:#f87171}
.btn.ok{background:rgba(34,197,94,.15);border-color:rgba(34,197,94,.4);color:#4ade80}
.btn.warn{background:rgba(245,158,11,.14);border-color:rgba(245,158,11,.38);color:#fbbf24}
.btn.sm{padding:10px 12px;font-size:13px;border-radius:11px;width:auto}
.btn:disabled{opacity:.4;pointer-events:none}

input,select,textarea{
  width:100%;padding:12px 13px;border-radius:11px;border:1px solid var(--border2);
  background:var(--surface2);color:var(--text);font-size:14.5px;font-family:inherit;
  transition:.15s;
}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);background:#0f1922}
label.fl{display:block;font-size:11.5px;font-weight:650;color:var(--muted);
  margin:0 0 6px 3px;letter-spacing:.4px;text-transform:uppercase}
.field{margin-bottom:12px}

/* ---------- HOME GRID ---------- */
.hero{
  background:linear-gradient(135deg,#0f2b2a 0%,#122030 55%,#141c28 100%);
  border:1px solid #1d3a3c;border-radius:20px;padding:17px;margin-bottom:6px;position:relative;overflow:hidden;
}
.hero::after{content:"";position:absolute;right:-40px;top:-40px;width:150px;height:150px;
  border-radius:50%;background:radial-gradient(circle,rgba(0,209,178,.16),transparent 70%)}
.hero h2{font-size:19px;font-weight:750;letter-spacing:-.2px;margin-bottom:2px}
.hero p{font-size:12.5px;color:var(--muted)}
.hero .who{display:flex;align-items:center;gap:9px;margin-top:14px}
.avatar{width:36px;height:36px;border-radius:11px;background:linear-gradient(135deg,#00d1b2,#0e7490);
  display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;color:#04211c;flex-shrink:0}
.avatar.role{background:linear-gradient(135deg,#3b82f6,#1e40af);color:#fff}

.grid{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.tile{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--r);
  padding:15px 13px;display:flex;flex-direction:column;gap:11px;cursor:pointer;
  transition:.15s;text-align:left;font-family:inherit;color:var(--text);position:relative;overflow:hidden;
}
.tile:active{transform:scale(.97);background:var(--surface2);border-color:var(--border2)}
.tile .tico{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;
  background:var(--surface3);color:var(--accent)}
.tile .tico svg{width:22px;height:22px}
.tile .ttl{font-size:13.5px;font-weight:700;line-height:1.25;letter-spacing:-.1px}
.tile .tdesc{font-size:11px;color:var(--muted2);line-height:1.3}
.tile.wide{grid-column:span 2;flex-direction:row;align-items:center;gap:14px}
.tile.wide .tilebody{flex:1}
.tile.wide .tico{background:linear-gradient(135deg,rgba(0,209,178,.2),rgba(0,209,178,.06));width:46px;height:46px}
.tile.wide .tico svg{width:25px;height:25px}
.tile .count{position:absolute;top:11px;right:11px;font-size:10px;font-weight:750;color:var(--muted2);
  background:var(--surface3);padding:2px 7px;border-radius:6px}

/* ---------- LIST ITEMS ---------- */
.li{
  display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--border);
  border-radius:13px;padding:12px 13px;margin-bottom:9px;cursor:pointer;transition:.15s;
}
.li:active{background:var(--surface2);transform:scale(.99)}
.li .licon{width:40px;height:40px;border-radius:11px;background:var(--surface3);
  display:flex;align-items:center;justify-content:center;flex-shrink:0;color:var(--accent)}
.li .licon svg{width:19px;height:19px}
.li .lbody{flex:1;min-width:0}
.li .ltitle{font-size:14px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .lsub{font-size:11.5px;color:var(--muted2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ---------- CHIPS ---------- */
.chips{display:flex;gap:7px;overflow-x:auto;padding:2px 0 8px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{
  padding:7px 13px;border-radius:20px;border:1px solid var(--border2);background:var(--surface);
  color:var(--muted);font-size:12.5px;font-weight:600;white-space:nowrap;cursor:pointer;
  font-family:inherit;transition:.15s;
}
.chip.active{background:rgba(0,209,178,.14);border-color:rgba(0,209,178,.45);color:var(--accent)}
.chip:active{transform:scale(.95)}

/* ---------- CAMERA ---------- */
.cam{display:flex;flex-direction:column;height:100%;background:#05080b}
.cam-stage{position:relative;flex:1;min-height:0;overflow:hidden;background:#05080b}
.cam-stage video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.85}
.cam-fallback{position:absolute;inset:0;display:none;
  background:
    radial-gradient(ellipse at 50% 40%,rgba(0,209,178,.07),transparent 60%),
    repeating-linear-gradient(0deg,rgba(255,255,255,.022) 0 1px,transparent 1px 42px),
    repeating-linear-gradient(90deg,rgba(255,255,255,.022) 0 1px,transparent 1px 42px),
    linear-gradient(160deg,#0d1620,#060a0e);
}
.cam-stage.nocam .cam-fallback{display:block}
#arCanvas{position:absolute;inset:0;pointer-events:none}
.ar-labels{position:absolute;inset:0;pointer-events:none;overflow:hidden}

.ar-label{
  position:absolute;transform:translate(-50%,-50%);pointer-events:auto;cursor:pointer;
  display:flex;align-items:center;gap:6px;padding:5px 9px 5px 5px;border-radius:9px;
  background:rgba(10,16,22,.88);border:1px solid rgba(0,209,178,.55);
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  font-size:11px;font-weight:650;color:#dff8f4;white-space:nowrap;font-family:inherit;
  box-shadow:0 4px 16px rgba(0,0,0,.5);transition:background .2s,border-color .2s;
  animation:lblIn .35s cubic-bezier(.2,1.3,.5,1) backwards;
}
@keyframes lblIn{from{opacity:0;transform:translate(-50%,-50%) scale(.7)}}
.ar-label .ar-num{
  width:17px;height:17px;border-radius:50%;background:var(--accent);color:#04211c;
  display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:800;flex-shrink:0;
}
.ar-label .ar-val{color:var(--accent);font-weight:750;font-family:ui-monospace,monospace;font-size:10.5px}
.ar-label.ok{border-color:rgba(34,197,94,.6)}
.ar-label.ok .ar-num{background:var(--ok);color:#03210e}
.ar-label.ok .ar-val{color:#4ade80}
.ar-label.nok{border-color:rgba(239,68,68,.75);background:rgba(30,8,8,.9);animation:lblIn .35s backwards,nokPulse 1.4s ease-in-out infinite .4s}
.ar-label.nok .ar-num{background:var(--nok);color:#fff}
.ar-label.nok .ar-val{color:#f87171}
@keyframes nokPulse{0%,100%{box-shadow:0 4px 16px rgba(0,0,0,.5),0 0 0 0 rgba(239,68,68,.5)}50%{box-shadow:0 4px 16px rgba(0,0,0,.5),0 0 0 7px rgba(239,68,68,0)}}
.ar-label.sel{outline:2px solid var(--accent);outline-offset:2px}

.cam-hud{position:absolute;top:0;left:0;right:0;padding:11px 12px;display:flex;
  align-items:flex-start;justify-content:space-between;gap:8px;pointer-events:none;z-index:5}
.cam-hud .hud-r{display:flex;flex-direction:column;gap:6px;align-items:flex-end}
.pill{
  display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:9px;
  background:rgba(8,13,18,.82);border:1px solid var(--border2);backdrop-filter:blur(10px);
  -webkit-backdrop-filter:blur(10px);font-size:10.5px;font-weight:700;letter-spacing:.5px;
  text-transform:uppercase;color:var(--muted);
}
.pill.live{border-color:rgba(239,68,68,.5);color:#f87171}
.pill.live .dot{width:6px;height:6px;border-radius:50%;background:#ef4444;animation:blink 1.1s infinite}
@keyframes blink{50%{opacity:.25}}
.pill.acc{border-color:rgba(0,209,178,.5);color:var(--accent)}

.det-card{
  position:absolute;left:12px;right:12px;bottom:12px;pointer-events:none;
  background:rgba(9,15,21,.9);border:1px solid rgba(0,209,178,.4);border-radius:14px;
  padding:11px 13px;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  display:flex;align-items:center;gap:12px;animation:up .3s cubic-bezier(.2,1.2,.5,1);
}
@keyframes up{from{opacity:0;transform:translateY(14px)}}
.det-card .dc-main{flex:1;min-width:0}
.det-card .dc-code{font-size:15px;font-weight:800;letter-spacing:-.2px}
.det-card .dc-name{font-size:11.5px;color:var(--muted)}
.conf-ring{position:relative;width:48px;height:48px;flex-shrink:0}
.conf-ring svg{transform:rotate(-90deg)}
.conf-ring .cnum{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-size:12px;font-weight:800;color:var(--accent)}

.scanline{position:absolute;left:0;right:0;height:2px;pointer-events:none;
  background:linear-gradient(90deg,transparent,var(--accent),transparent);
  box-shadow:0 0 18px 3px rgba(0,209,178,.55);display:none}
.scanline.on{display:block;animation:scan 1.9s ease-in-out infinite}
@keyframes scan{0%{top:12%;opacity:0}12%{opacity:1}88%{opacity:1}100%{top:88%;opacity:0}}

.cam-panel{
  flex-shrink:0;background:#0b121a;border-top:1px solid var(--border);
  padding:12px 14px calc(14px + env(safe-area-inset-bottom));
  max-height:50%;overflow-y:auto;
}
.steps{display:flex;gap:5px;margin-bottom:12px}
.steps .st{flex:1;height:3px;border-radius:2px;background:var(--surface3);transition:.3s}
.steps .st.done{background:var(--accent)}
.steps .st.act{background:var(--accent);box-shadow:0 0 8px rgba(0,209,178,.7)}

.progress{height:5px;border-radius:3px;background:var(--surface3);overflow:hidden;margin:9px 0}
.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),#3b82f6);transition:width .4s}

/* ---------- SHEET ---------- */
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:100;opacity:0;
  transition:.22s;backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
.sheet-bg.show{opacity:1}
.sheet{
  position:fixed;left:0;right:0;bottom:0;z-index:101;background:#101923;
  border-radius:22px 22px 0 0;border-top:1px solid var(--border2);
  padding:10px 16px calc(20px + env(safe-area-inset-bottom));
  max-width:600px;margin:0 auto;transform:translateY(102%);transition:transform .28s cubic-bezier(.2,.9,.3,1);
  max-height:86dvh;overflow-y:auto;
}
.sheet.show{transform:translateY(0)}
.sheet .grab{width:38px;height:4px;border-radius:3px;background:var(--border2);margin:0 auto 14px}

/* ---------- TABLE ---------- */
.tbl{width:100%;border-collapse:collapse;font-size:12.5px}
.tbl th{text-align:left;font-size:10px;font-weight:700;color:var(--muted2);
  text-transform:uppercase;letter-spacing:.7px;padding:0 8px 8px 0;border-bottom:1px solid var(--border)}
.tbl td{padding:9px 8px 9px 0;border-bottom:1px solid rgba(35,48,62,.6);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl .num{font-family:ui-monospace,monospace;font-weight:650;text-align:right}

/* ---------- DRAWING ---------- */
.dwg-wrap{background:#0d141c;border:1px solid var(--border);border-radius:var(--r);
  padding:10px;overflow:hidden}
.dwg-wrap svg{width:100%;height:auto;display:block}

/* ---------- STAT ---------- */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:10px 8px;text-align:center}
.stat .v{font-size:19px;font-weight:800;letter-spacing:-.5px;line-height:1.15}
.stat .k{font-size:9.5px;color:var(--muted2);text-transform:uppercase;letter-spacing:.7px;font-weight:700;margin-top:2px}
.stat.ok .v{color:#4ade80}.stat.nok .v{color:#f87171}

.empty{text-align:center;padding:44px 20px;color:var(--muted2)}
.empty svg{width:44px;height:44px;opacity:.35;margin-bottom:12px}
.empty p{font-size:13px}

.toast{position:fixed;left:50%;bottom:88px;transform:translate(-50%,20px);z-index:200;
  background:#1b2733;border:1px solid var(--border2);color:var(--text);
  padding:11px 18px;border-radius:12px;font-size:13px;font-weight:600;
  box-shadow:0 10px 34px rgba(0,0,0,.6);opacity:0;transition:.25s;pointer-events:none;max-width:88vw;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast.err{border-color:rgba(239,68,68,.5);color:#fca5a5}
.toast.ok{border-color:rgba(34,197,94,.5);color:#86efac}

.note{background:rgba(245,158,11,.08);border:1px solid rgba(245,158,11,.28);
  border-radius:11px;padding:10px 12px;font-size:11.5px;color:#fbbf24;line-height:1.5;display:flex;gap:9px}
.note svg{width:16px;height:16px;flex-shrink:0;margin-top:1px}
.note.info{background:rgba(59,130,246,.08);border-color:rgba(59,130,246,.28);color:#93c5fd}

.kv{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px solid rgba(35,48,62,.55);font-size:13px}
.kv:last-child{border-bottom:0}
.kv .k{color:var(--muted)}
.kv .v{font-weight:650;text-align:right}

.hidden{display:none!important}
</style>
</head>
<body>
<div id="app">
  <header id="topbar"></header>
  <main id="screen"></main>
  <nav id="tabbar"></nav>
</div>
<div id="sheetRoot"></div>
<div id="toast" class="toast"></div>

<script>
/* =========================================================================
   IQC AI — Giriş Kalite Kontrol (Mock AI Prototip)
   ========================================================================= */

/* ---------- ICONS ---------- */
const I = {
  back:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>',
  close:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg>',
  cam:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l2-2.6h6L17 8h3a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1z"/><circle cx="12" cy="13" r="3.3"/></svg>',
  camPlus:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l2-2.6h6L17 8h3a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1z"/><circle cx="12" cy="13" r="3.3"/><path d="M12 11.6v2.8M10.6 13h2.8"/></svg>',
  hist:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.6"/><path d="M12 7v5.2l3.4 2"/></svg>',
  box:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 4.2v9.6L12 21l-8-4.2V7.2L12 3z"/><path d="M4 7.2l8 4.2 8-4.2M12 11.4V21"/></svg>',

}

function isOK(f, val){
  if(val==null || isNaN(val)) return null;
  if(f.tolP==null) return true;
  return val >= (f.nominal - f.tolM - 1e-9) && val <= (f.nominal + f.tolP + 1e-9);
}
function deviation(f,val){ return val - f.nominal; }
function effVal(rec){ return rec==null?null:(rec.manual!=null?rec.manual:rec.ai); }

function toast(msg, type=''){
  const t=$('#toast'); t.textContent=msg; t.className='toast show '+type;
  clearTimeout(t._t); t._t=setTimeout(()=>t.className='toast',2400);
}
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

let route = {name:'home', params:{}};
let cleanup = null;

function go(name, params={}){
  if(cleanup){ try{cleanup();}catch(e){} cleanup=null; }
  route = {name, params};
  render();
  const sc = $('#screen'); if(sc) sc.scrollTop = 0;
}

function render(){
  const isCam = route.name==='camera';
  document.body.classList.toggle('cam', isCam);

  const [t, sub] = TITLES[route.name] || ['IQC AI',''];
  const canBack = !['home','history','products','settings','camera'].includes(route.name);

  $('#topbar').innerHTML = `
    ${canBack?`<button class="iconbtn" data-act="back">${I.back}</button>`:''}
    ${!canBack && route.name!=='home' ? `<div style="width:2px"></div>` : ''}
    ${!canBack && route.name==='home' ? `<div class="avatar" style="width:34px;height:34px;border-radius:10px;font-size:12px">${esc(initials(S.settings.user.name))}</div>`:''}
    <div style="flex:1;min-width:0">
      <div class="tb-title">${esc(t)}</div>
      ${sub?`<div class="tb-sub">${esc(sub)}</div>`:''}
    </div>
    ${route.name==='home'?`<button class="iconbtn" data-go="settings">${I.gear}</button>`:''}
    ${route.name==='camera'?`<button class="iconbtn" data-act="closeCam">${I.close}</button>`:''}
  `;

  const R = SCREENS[route.name];
  $('#screen').innerHTML = R ? R.html() : '<div class="empty"><p>Ekran bulunamadı</p></div>';

  // tabbar
  if(isCam){ $('#tabbar').style.display='none'; }
  else{
    $('#tabbar').style.display='flex';
    $('#tabbar').innerHTML = TABS.map(tb=>`
      <button data-go="${tb.route}" class="${(route.name===tb.id||(tb.id==='products'&&route.name.startsWith('product')))?'active':''}">
        ${I[tb.icon]}<span>${tb.label}</span>
      </button>`).join('');
  }

  if(R && R.mount) R.mount();
}

function initials(n){
  return String(n||'?').split(' ').map(x=>x[0]).slice(0,2).join('').toUpperCase();
}

/* Global event delegation */
document.addEventListener('click', e=>{
  const g = e.target.closest('[data-go]');
  if(g){ go(g.dataset.go, JSON.parse(g.dataset.params||'{}')); return; }
  const a = e.target.closest('[data-act]');
  if(a){
    const act = a.dataset.act;
    if(act==='back'){ go(a.dataset.to||'home'); }
    if(act==='closeCam'){ stopCamera(); go('home'); }
    if(act==='toast'){ toast(a.dataset.msg||'Bilgi'); }
  }
});

let cam = null;
let rafId = null;

function initCam(){
  cam = {
    phase:'searching',     // searching | lowconf | detected | calibrating | calibrated | measuring | measured
    product:null,
    confidence:0,
    targetConf:0,
    calibrated:false,
    refFound:false,
    pxPerMM:0,
    measurements:{},
    selected:null,
    stream:null,
    t0: Date.now()
  };
}
function stopCamera(){
  if(cam && cam.stream){ cam.stream.getTracks().forEach(t=>t.stop()); cam.stream=null; }
  if(rafId){ cancelAnimationFrame(rafId); rafId=null; }
}

SCREENS.camera = {
  html(){
    if(!cam) initCam();
    return `

      <div class="cam-stage" id="camStage">

    </div>`

};

async function mountCamera(){
  cleanup = ()=>{ stopCamera(); };

  const video = $('#camVideo');
  const stage = $('#camStage');

  // Start camera
  try{
    const stream = await navigator.mediaDevices.getUserMedia({
      video:{ facingMode:{ideal:'environment'}, width:{ideal:1920}, height:{ideal:1080} }, audio:false
    });
    cam.stream = stream;
    video.srcObject = stream;
    await video.play().catch(()=>{});
  }catch(e){
    stage.classList.add('nocam');
  }

  cam.t0 = Date.now();
  cam.phase = 'searching';
  updateCamUI();
  arLoop();

  // Simulate detection
  setTimeout(()=>{
    if(!cam) return;
    const p = S.products.find(x=>x.code==='BRK-125') || S.products[0];
    cam.product = p;
    cam.targetConf = 0.90 + Math.random()*0.09; // 90-99%
    animateConfidence();
  }, 2100);
}

function animateConfidence(){
  const tick = ()=>{
    if(!cam || !cam.product) return;
    if(cam.confidence < cam.targetConf){
      cam.confidence = Math.min(cam.targetConf, cam.confidence + 0.022 + Math.random()*0.02);
      updateCamUI();
      setTimeout(tick, 45);
    }else{
      const pct = Math.round(cam.confidence*100);
      cam.phase = pct >= S.settings.minConf ? 'detected' : 'lowconf';
      updateCamUI();
    }
  };
  tick();
}

/* ---------- Detection card overlay ---------- */
function updateLabels(){
  const el = $('#arLabels');
  if(!el) return;
  if(!cam || !cam.product){ el.innerHTML=''; return; }
  const v = cam._view;
  if(!v){ el.innerHTML=''; return; }

  const p = cam.product;
  let html = '';
  p.features.forEach(f=>{
    const m = cam.measurements[f.id];
    let cls = 'ar-label';
    if(m){ cls += isOK(f,m.ai) ? ' ok' : ' nok'; }
    if(cam.selected===f.id) cls += ' sel';

    const cx = v.ox + f.ar.lx*v.k;
    const cy = v.oy + f.ar.ly*v.k;
    const x = Math.max(78, Math.min(v.W-78, cx));
    const y = Math.max(16, Math.min(v.H-16, cy));
    f._px = {x,y};

    html += `<button class="${cls}" data-arid="${f.id}" style="left:${x}px;top:${y}px">
      <span class="ar-num">${f.id}</span>
      <span class="ar-txt">${esc(f.display)}</span>
      ${m?`<span class="ar-val">${fmtN(m.ai)}</span>`:''}
    </button>`;
  });
  el.innerHTML = html;

  el.querySelectorAll('[data-arid]').forEach(b=>{
    b.onclick = (e)=>{ e.stopPropagation(); openFeatureSheet(Number(b.dataset.arid)); };
  });
}

/* ---------- AR Canvas drawing ---------- */
function drawScene(){
  const stage = $('#camStage');
  if(!stage || !cam) return;
  const cv = $('#arCanvas');
  const W = stage.clientWidth, H = stage.clientHeight;
  if(!W || !H) return;
  const dpr = Math.min(window.devicePixelRatio||1, 2);
  cv.width = W*dpr; cv.height = H*dpr;
  cv.style.width = W+'px'; cv.style.height = H+'px';
  const ctx = cv.getContext('2d');
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.clearRect(0,0,W,H);

  // scanning effect
  if(cam.phase==='searching'){
    drawGrid(ctx,W,H);
    return;
  }
  if(!cam.product) return;

  const G = cam.product.geom;
  let pw = W*0.78;
  let ph = pw*(G.H/G.W);
  const maxH = H*0.44;
  if(ph > maxH){ ph = maxH; pw = ph*(G.W/G.H); }
  const k = pw/G.W;
  const ox = W/2 - pw/2;
  const oy = H*0.50 - ph/2;
  cam._view = {ox,oy,k,pw,ph,W,H};
  cam.pxPerMM = k;

  if(S.settings.showSynthetic){
    // Glow
    ctx.save();
    ctx.shadowColor = 'rgba(0,209,178,.45)';
    ctx.shadowBlur = 22;

    // Body
    roundRect(ctx, ox, oy, pw, ph, Math.min(G.R*k, ph/2));
    const grad = ctx.createLinearGradient(ox, oy, ox+pw, oy+ph);
    grad.addColorStop(0,'rgba(158,178,196,.50)');
    grad.addColorStop(.45,'rgba(112,132,152,.38)');
    grad.addColorStop(1,'rgba(72,92,112,.52)');
    ctx.fillStyle = grad; ctx.fill();
    ctx.restore();

    ctx.strokeStyle = 'rgba(0,209,178,.85)';
    ctx.lineWidth = 2;
    roundRect(ctx, ox, oy, pw, ph, Math.min(G.R*k, ph/2));
    ctx.stroke();

    // Holes
    G.holes.forEach(h=>{
      ctx.beginPath();
      ctx.arc(ox+h.x*k, oy+h.y*k, (h.d/2)*k, 0, Math.PI*2);
      ctx.fillStyle = 'rgba(6,10,14,.94)';
      ctx.fill();
      ctx.strokeStyle='rgba(0,209,178,.7)'; ctx.lineWidth=1.6; ctx.stroke();
    });

    // corner brackets
    drawCorners(ctx, ox, oy, pw, ph);
  }

  // Leader lines to labels
  cam.product.features.forEach(f=>{
    if(!f._px) return;
    const ax = ox + f.ar.x*k, ay = oy + f.ar.y*k;
    const m = cam.measurements[f.id];
    const r = m ? isOK(f,m.ai) : null;
    ctx.beginPath();
    ctx.moveTo(ax, ay);
    ctx.lineTo(f._px.x, f._px.y);
    ctx.strokeStyle = r===false ? 'rgba(239,68,68,.75)' : r===true ? 'rgba(34,197,94,.6)' : 'rgba(0,209,178,.5)';
    ctx.lineWidth = 1.2;
    ctx.setLineDash([4,4]);
    ctx.stroke();
    ctx.setLineDash([]);

    // anchor dot
    ctx.beginPath();
    ctx.arc(ax, ay, 3.2, 0, Math.PI*2);
    ctx.fillStyle = r===false ? '#ef4444' : r===true ? '#22c55e' : '#00d1b2';
    ctx.fill();
    ctx.beginPath();
    ctx.arc(ax, ay, 7, 0, Math.PI*2);
    ctx.strokeStyle = r===false ? 'rgba(239,68,68,.5)' : 'rgba(0,209,178,.4)';
    ctx.lineWidth = 1.2; ctx.stroke();
  });
}

function roundRect(ctx,x,y,w,h,r){
  r = Math.min(r, w/2, h/2);
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.lineTo(x+w-r,y); ctx.quadraticCurveTo(x+w,y,x+w,y+r);
  ctx.lineTo(x+w,y+h-r); ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  ctx.lineTo(x+r,y+h); ctx.quadraticCurveTo(x,y+h,x,y+h-r);
  ctx.lineTo(x,y+r); ctx.quadraticCurveTo(x,y,x+r,y);
  ctx.closePath();
}

function drawCorners(ctx,x,y,w,h){
  const L = 22;
  ctx.strokeStyle='rgba(0,209,178,.95)'; ctx.lineWidth=2.6; ctx.lineCap='round';
  const pts = [[x,y,1,1],[x+w,y,-1,1],[x,y+h,1,-1],[x+w,y+h,-1,-1]];
  pts.forEach(([px,py,sx,sy])=>{
    ctx.beginPath();
    ctx.moveTo(px+sx*L, py); ctx.lineTo(px, py); ctx.lineTo(px, py+sy*L);
    ctx.stroke();
  });
}

function drawGrid(ctx,W,H){
  ctx.strokeStyle='rgba(0,209,178,.09)'; ctx.lineWidth=1;
  const g=48;
  for(let x=0;x<W;x+=g){ ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,H); ctx.stroke(); }
  for(let y=0;y<H;y+=g){ ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(W,y); ctx.stroke(); }
}

function arLoop(){
  drawScene();
  updateLabels();
  rafId = requestAnimationFrame(arLoop);
}

/* ---------- Calibration ---------- */
function startCalibration(){
  cam.phase = 'calibrating';
  updateCamUI();
  
  const video = document.getElementById('camVideo');
  
  if(!cvReady_flag){
    toast('OpenCV henüz yüklenmedi, bekleyin…','warn');
    setTimeout(()=>startCalibration(), 2000);
    return;
  }
  
  setTimeout(()=>{
    const ref = detectReference(video, S.settings.refMM);
    
    if(ref && ref.pxPerMM > 0.5 && ref.pxPerMM < 100){
      cam.pxPerMM = ref.pxPerMM;
      cam.calibrated = true;
      cam.refFound = true;
      cam.refCorners = ref.corners;

      toast(`✅ Referans bulundu: ${S.settings.refMM} mm → ${ref.pxPerMM.toFixed(2)} px/mm`, 'ok');
    } else {
      cam.phase = 'detected';
      toast('❌ Referans algılanamadı. Mastarı kameraya net gösterin, ışık iyi olsun.','err');
    }

  }, 1500);

/* ---------- Measurements ---------- */
function runMeasurements(){
  const feats = cam.product.features;
  cam.phase = 'measuring';
  cam.measurements = {};
  updateCamUI();
  
  const video = document.getElementById('camVideo');
  
  // Kalibrasyon yoksa uyar
  if(!cam.calibrated || !cam.pxPerMM){
    toast('Önce referans kalibrasyonu yapın','err');
    cam.phase = 'detected';
    updateCamUI();
    return;
  }
  
  // OpenCV hazır mı?
  if(!cvReady_flag){
    toast('OpenCV yükleniyor, 3 saniye sonra tekrar deneyin','warn');
    setTimeout(()=>{ cam.phase = 'calibrated'; updateCamUI(); }, 3000);
    return;
  }
  
  // Gerçek görüntü analizi
  toast('Görüntü işleniyor…');
  
  setTimeout(()=>{
    // Delikleri bul
    const circles = detectCircles(video, cam.pxPerMM);
    console.log('Bulunan delikler:', circles);
    cam.detectedCircles = circles;
    
    // Parça sınırını bul
    const bbox = detectPartBBox(video);
    cam.partBBox = bbox;
    
    // Her özellik için gerçek ölçüm dene
    feats.forEach((f, i)=>{
      setTimeout(()=>{
        const r = realMeasure(f, video, cam.pxPerMM, circles, bbox);
        if(r.ai != null){
          cam.measurements[f.id] = { 
            ai: r.ai, 
            manual: null, 
            source: r.source,
            confidence: r.confidence 
          };
        } else {
          // Görüntüden ölçülemediyse mock fallback
          cam.measurements[f.id] = { 
            ai: mockMeasure(f, false), 
            manual: null,
            source: 'mock-fallback',
            note: r.error
          };
        }
        updateCamUI();
      }, 150*(i+1));
    });
    
    setTimeout(()=>{
      cam.phase = 'measured';
      updateCamUI();
    }, 150*feats.length + 500);
  }, 300);
}
/* ======================================================================
   GERÇEK GÖRÜNTÜ İŞLEME MODÜLÜ (OpenCV.js)
   ====================================================================== */

// Video karesini canvas'a al
function grabFrame(video){
  const c = document.createElement('canvas');
  c.width = video.videoWidth;
  c.height = video.videoHeight;
  c.getContext('2d').drawImage(video, 0, 0);
  return c;
}

// Kalibrasyon: kullanıcının gösterdiği referans nesneyi bul
function detectReference(video, knownMM){
  if(!cvReady_flag) return null;
  try{
    const frame = grabFrame(video);
    let src = cv.imread(frame);
    let gray = new cv.Mat();
    cv.cvtColor(src, gray, cv.COLOR_RGBA2GRAY);
    cv.GaussianBlur(gray, gray, new cv.Size(5,5), 0);
    
    // Canny kenar tespiti
    let edges = new cv.Mat();
    cv.Canny(gray, edges, 50, 150);
    
    // Konturları bul
    let contours = new cv.MatVector();
    let hierarchy = new cv.Mat();
    cv.findContours(edges, contours, hierarchy, cv.RETR_EXTERNAL, cv.CHAIN_APPROX_SIMPLE);
    
    // En büyük dikdörtgeni bul (referans)
    let best = null, bestArea = 0;
    for(let i=0; i<contours.size(); i++){
      const c = contours.get(i);
      const area = cv.contourArea(c);
      if(area < 2000) continue; // küçük gürültüleri atla
      const peri = cv.arcLength(c, true);
      const approx = new cv.Mat();
      cv.approxPolyDP(c, approx, 0.02*peri, true);
      if(approx.rows === 4 && area > bestArea){
        best = approx;
        bestArea = area;
      }
      approx.delete();
    }
    
    if(!best){
      src.delete(); gray.delete(); edges.delete();
      contours.delete(); hierarchy.delete();
      return null;
    }
    
    // Köşe noktalarını al
    const pts = [];
    for(let i=0; i<4; i++){
      pts.push({x: best.intPtr(i,0)[0], y: best.intPtr(i,0)[1]});
    }
    
    // Kenar uzunlukları
    const d = (a,b)=>Math.hypot(a.x-b.x, a.y-b.y);
    const side1 = d(pts[0], pts[1]);
    const side2 = d(pts[1], pts[2]);
    const avgPx = (side1 + side2) / 2;
    const pxPerMM = avgPx / knownMM;
    
    // Temizlik
    src.delete(); gray.delete(); edges.delete();
    contours.delete(); hierarchy.delete(); best.delete();
    
    return {
      pxPerMM,
      corners: pts,
      pxSize: avgPx,
      referenceMM: knownMM
    };
  }catch(e){
    console.error('Kalibrasyon hatası:', e);
    return null;
  }
}

// Delik tespiti (Hough Circle)
function detectCircles(video, pxPerMM){
  if(!cvReady_flag) return [];
  try{
    const frame = grabFrame(video);
    let src = cv.imread(frame);
    let gray = new cv.Mat();
    cv.cvtColor(src, gray, cv.COLOR_RGBA2GRAY);
    cv.medianBlur(gray, gray, 5);
    
    let circles = new cv.Mat();
    // HoughCircles(image, circles, method, dp, minDist, param1, param2, minR, maxR)
    // minR ve maxR piksel cinsinden — mm'den çeviriyoruz
    const minR = Math.max(5, Math.round(3 * pxPerMM));   // min 3mm çap
    const maxR = Math.round(60 * pxPerMM);                // max 60mm çap
    cv.HoughCircles(gray, circles, cv.HOUGH_GRADIENT, 1, 
                    Math.round(20*pxPerMM), 100, 30, minR, maxR);
    
    const result = [];
    for(let i=0; i<circles.cols; i++){
      const x = circles.data32F[i*3];
      const y = circles.data32F[i*3+1];
      const r = circles.data32F[i*3+2];
      result.push({
        x, y, r,
        diameterMM: (r * 2) / pxPerMM,
        confidence: 0.85 + Math.random()*0.10
      });
    }
    
    src.delete(); gray.delete(); circles.delete();
    // Büyükten küçüğe sırala
    return result.sort((a,b)=>b.diameterMM - a.diameterMM);
  }catch(e){
    console.error('Delik tespiti hatası:', e);
    return [];
  }
}

// İki delik arasındaki mesafeyi mm cinsinden hesapla
function distanceBetween(c1, c2, pxPerMM){
  return Math.hypot(c1.x-c2.x, c1.y-c2.y) / pxPerMM;
}

// Gerçek ölçüm — mock ölçümün yerini alır
function realMeasure(f, video, pxPerMM, detectedCircles, partBBox){
  if(!cvReady_flag || !video || !pxPerMM){
    return { ai: null, source: 'unavailable', error: 'Kalibrasyon yok' };
  }
  
  try{
    switch(f.type){
      case 'Çap': {
        // En yakın çemberi bul
        const target = f.nominal;
        let best = null, bestDiff = Infinity;
        detectedCircles.forEach(c=>{
          const diff = Math.abs(c.diameterMM - target);
          if(diff < bestDiff){ bestDiff = diff; best = c; }
        });
        if(best && bestDiff < target*0.3){
          return { ai: +best.diameterMM.toFixed(2), source: 'cv-hough', confidence: best.confidence };
        }
        return { ai: null, source: 'cv-hough', error: 'Delik bulunamadı' };
      }
      case 'Mesafe': {
        if(detectedCircles.length >= 2){
          const d = distanceBetween(detectedCircles[0], detectedCircles[1], pxPerMM);
          return { ai: +d.toFixed(2), source: 'cv-distance', confidence: 0.82 };
        }
        return { ai: null, source: 'cv-distance', error: 'Yeterli delik yok' };
      }
      case 'Uzunluk': {
        if(partBBox){
          const wMM = partBBox.width / pxPerMM;
          const hMM = partBBox.height / pxPerMM;
          const val = Math.abs(wMM - f.nominal) < Math.abs(hMM - f.nominal) ? wMM : hMM;
          return { ai: +val.toFixed(2), source: 'cv-bbox', confidence: 0.75 };
        }
        return { ai: null, source: 'cv-bbox', error: 'Parça sınırı bulunamadı' };
      }
      case 'Kalınlık':
      case 'Konum':
      case 'Yüzey':
      default:
        return { ai: null, source: 'n/a', error: 'Bu ölçüm tipi için manuel giriş gerekli' };
    }
  }catch(e){
    return { ai: null, source: 'error', error: e.message };
  }
}

// Parçanın sınırlayıcı kutusu (bounding box)
function detectPartBBox(video){
  if(!cvReady_flag) return null;
  try{
    const frame = grabFrame(video);
    let src = cv.imread(frame);
    let gray = new cv.Mat();
    let edges = new cv.Mat();
    cv.cvtColor(src, gray, cv.COLOR_RGBA2GRAY);
    cv.GaussianBlur(gray, gray, new cv.Size(5,5), 0);
    cv.Canny(gray, edges, 30, 100);
    
    let contours = new cv.MatVector();
    let hierarchy = new cv.Mat();
    cv.findContours(edges, contours, hierarchy, cv.RETR_EXTERNAL, cv.CHAIN_APPROX_SIMPLE);
    
    let best = null, bestArea = 0;
    for(let i=0; i<contours.size(); i++){
      const c = contours.get(i);
      const area = cv.contourArea(c);
      if(area > bestArea && area > 5000){
        best = c; bestArea = area;
      }
    }
    
    if(!best){ 
      src.delete(); gray.delete(); edges.delete(); contours.delete(); hierarchy.delete();
      return null; 
    }
    
    const rect = cv.boundingRect(best);
    src.delete(); gray.delete(); edges.delete(); contours.delete(); hierarchy.delete();
    return { x: rect.x, y: rect.y, width: rect.width, height: rect.height };
  }catch(e){
    return null;
  }
}
function mockMeasure(f, forceNOK){
  if(f.type==='Yüzey'){
    const base = f.nominal;
    return +( forceNOK ? base*(1.4) : base*(0.92+Math.random()*0.2) ).toFixed(1);
  }
  const tol = f.tolP || 0.1;
  let dev;
  if(forceNOK){
    const sign = Math.random()<0.5?-1:1;
    dev = sign * tol * (1.15 + Math.random()*0.9);
  }else{
    dev = (Math.random()*2-1) * tol * 0.85;
  }
  const dec = f.nominal >= 100 ? 2 : 2;
  return +(f.nominal + dev).toFixed(dec);
}

/* =========================================================================
   TECHNICAL DRAWING GENERATOR
   ========================================================================= */
function drawingSVG(p){
  const G = p.geom || {W:150,H:60,R:10,holes:[]};
  const VB_W = 560, VB_H = 340;
  const areaX = 30, areaY = 24, areaW = 380, areaH = 200;
  const scale = Math.min(areaW/G.W, areaH/G.H);
  const pw = G.W*scale, ph = G.H*scale;
  const ox = areaX + (areaW - pw)/2;
  const oy = areaY + (areaH - ph)/2;

  const X = mm => ox + mm*scale;
  const Y = mm => oy + mm*scale;

  const holes = (G.holes||[]).map(h=>`
    <circle cx="${X(h.x).toFixed(1)}" cy="${Y(h.y).toFixed(1)}" r="${(h.d/2*scale).toFixed(1)}"
      fill="#0a1119" stroke="#5fd6c4" stroke-width="1.1"/>
    <line x1="${(X(h.x)-3).toFixed(1)}" y1="${Y(h.y).toFixed(1)}" x2="${(X(h.x)+3).toFixed(1)}" y2="${Y(h.y).toFixed(1)}" stroke="#5fd6c4" stroke-width=".8"/>
    <line x1="${X(h.x).toFixed(1)}" y1="${(Y(h.y)-3).toFixed(1)}" x2="${X(h.x).toFixed(1)}" y2="${(Y(h.y)+3).toFixed(1)}" stroke="#5fd6c4" stroke-width=".8"/>
  `).join('');

  // Dimension helpers
  const dimH = (x1,x2,y,label)=>{
    const px1=X(x1), px2=X(x2), py=Y(y);
    return `
      <line x1="${px1}" y1="${py}" x2="${px2}" y2="${py}" stroke="#7fb3c9" stroke-width=".9"/>
      <line x1="${px1}" y1="${py-5}" x2="${px1}" y2="${py+5}" stroke="#7fb3c9" stroke-width=".9"/>
      <line x1="${px2}" y1="${py-5}" x2="${px2}" y2="${py+5}" stroke="#7fb3c9" stroke-width=".9"/>
      <rect x="${(px1+px2)/2-32}" y="${py-9}" width="64" height="14" fill="#0d141c"/>
      <text x="${(px1+px2)/2}" y="${py+2}" fill="#8fd8c9" font-size="10.5" font-family="monospace" text-anchor="middle">${label}</text>
    `;
  };
  const dimV = (y1,y2,x,label)=>{
    const py1=Y(y1), py2=Y(y2), px=X(x);
    return `
      <line x1="${px}" y1="${py1}" x2="${px}" y2="${py2}" stroke="#7fb3c9" stroke-width=".9"/>
      <line x1="${px-5}" y1="${py1}" x2="${px+5}" y2="${py1}" stroke="#7fb3c9" stroke-width=".9"/>
      <line x1="${px-5}" y1="${py2}" x2="${px+5}" y2="${py2}" stroke="#7fb3c9" stroke-width=".9"/>
      <text x="${px+5}" y="${(py1+py2)/2+3}" fill="#8fd8c9" font-size="10.5" font-family="monospace">${label}</text>
    `;
  };

  return `
  <svg viewBox="0 0 ${VB_W} ${VB_H}" xmlns="http://www.w3.org/2000/svg" style="background:#0d141c;border-radius:8px">
    <defs>
      <pattern id="gp" width="20" height="20" patternUnits="userSpaceOnUse">
        <path d="M20 0H0V20" fill="none" stroke="#182430" stroke-width=".6"/>
      </pattern>
    </defs>
    <rect width="${VB_W}" height="${VB_H}" fill="url(#gp)" opacity=".6"/>

    <!-- Part -->
    <rect x="${ox}" y="${oy}" width="${pw}" height="${ph}" rx="${(G.R*scale).toFixed(1)}"
      fill="#16202b" stroke="#7fd8c8" stroke-width="1.6"/>
    ${holes}

    <!-- Dimensions -->
    ${dimH(0, G.W, G.H + 14, G.W.toFixed(2))}
    ${dimV(0, G.H, G.W + 8, G.H.toFixed(2))}
    ${G.holes.length>=2 ? dimH(G.holes[0].x, G.holes[1].x, -8, Math.abs(G.holes[1].x-G.holes[0].x).toFixed(2)) : ''}
    ${G.holes.length>=1 ? `
      <line x1="${X(G.holes[0].x)}" y1="${Y(0)}" x2="${X(G.holes[0].x)+46}" y2="${Y(0)-26}" stroke="#7fb3c9" stroke-width=".8"/>
      <text x="${X(G.holes[0].x)+50}" y="${Y(0)-24}" fill="#8fd8c9" font-size="10.5" font-family="monospace">Ø${G.holes[0].d.toFixed(2)}</text>
    ` : ''}

    <!-- Center lines -->
    ${(G.holes||[]).map(h=>`
      <line x1="${X(h.x)}" y1="${Y(0)-14}" x2="${X(h.x)}" y2="${Y(G.H)+14}" stroke="#3d5468" stroke-width=".6" stroke-dasharray="8 4 2 4"/>
      <line x1="${X(0)-14}" y1="${Y(h.y)}" x2="${X(G.W)+14}" y2="${Y(h.y)}" stroke="#3d5468" stroke-width=".6" stroke-dasharray="8 4 2 4"/>
    `).join('')}

    <!-- Corner radii note -->
    <text x="${ox}" y="${oy-10}" fill="#5c7c8e" font-size="10" font-family="monospace">R${G.R.toFixed(1)}</text>

    <!-- Title block -->
    <g transform="translate(${VB_W-190},${VB_H-108})">
      <rect x="0" y="0" width="180" height="98" fill="#111a24" stroke="#2a3a4a" stroke-width="1"/>
      <line x1="0" y1="26" x2="180" y2="26" stroke="#2a3a4a"/>
      <line x1="0" y1="50" x2="180" y2="50" stroke="#2a3a4a"/>
      <line x1="0" y1="74" x2="180" y2="74" stroke="#2a3a4a"/>
      <line x1="90" y1="50" x2="90" y2="98" stroke="#2a3a4a"/>
      <text x="8" y="17" fill="#e2eef7" font-size="12" font-weight="700" font-family="monospace">${esc(p.code)}</text>
      <text x="8" y="41" fill="#7f97a8" font-size="10" font-family="monospace">${esc(p.name)}</text>
      <text x="8" y="65" fill="#7f97a8" font-size="10" font-family="monospace">MALZ: ${esc(p.material||'—')}</text>
      <text x="96" y="65" fill="#7f97a8" font-size="10" font-family="monospace">ÖLÇEK 1:1</text>
      <text x="8" y="89" fill="#00d1b2" font-size="11" font-weight="700" font-family="monospace">REV ${esc(p.rev)}</text>
      <text x="96" y="89" fill="#7f97a8" font-size="9" font-family="monospace">mm / ISO 2768-m</text>
    </g>

    <text x="30" y="${VB_H-16}" fill="#3d5468" font-size="9" font-family="monospace">IQC AI · Teknik Resim Arşivi · Otomatik üretilmiş önizleme</text>
  </svg>`;
}

function printReport(inspId){
  const i = S.inspections.find(x=>x.id===inspId);
  if(!i) return;
  const p = getProduct(i.productId), s = getSupplier(i.supplierId);
  let okc=0, nokc=0;
  const rows = p.features.map(f=>{
    const rec = i.results[f.id]||{};
    const v = effVal(rec);
    const r = isOK(f,v);
    if(r===true) okc++; else if(r===false) nokc++;
    return {f,rec,v,r};
  });

  const html = `<!doctype html><html lang="tr"><head><meta charset="utf-8">
  <title>IQC Raporu ${esc(i.id)}</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:#111;padding:24px;font-size:12px;background:#fff}
    h1{font-size:19px;margin-bottom:2px}
    h2{font-size:12px;text-transform:uppercase;letter-spacing:1px;color:#555;margin:18px 0 8px;border-bottom:1.5px solid #111;padding-bottom:4px}
    .sub{color:#666;font-size:11px;margin-bottom:14px}
    .grid{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:8px;margin-bottom:8px}
    .box{border:1px solid #ccc;border-radius:6px;padding:8px}
    .box .k{font-size:9px;text-transform:uppercase;letter-spacing:.7px;color:#666;font-weight:700}
    .box .v{font-size:15px;font-weight:800;margin-top:2px}
    table{width:100%;border-collapse:collapse;font-size:11px}
    th{text-align:left;background:#f2f4f6;padding:6px;border:1px solid #d5dade;font-size:9.5px;text-transform:uppercase;letter-spacing:.5px}
    td{padding:5px 6px;border:1px solid #e2e6ea}
    .ok{color:#15803d;font-weight:800}.nok{color:#b91c1c;font-weight:800}
    .kv{display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px solid #eee}
    .decision{margin-top:16px;padding:14px;border:2px solid #111;border-radius:8px;text-align:center;font-size:18px;font-weight:900;letter-spacing:2px}
    .foot{margin-top:22px;font-size:9.5px;color:#777;border-top:1px solid #ddd;padding-top:8px;line-height:1.6}
    .sign{display:flex;gap:40px;margin-top:26px}
    .sign div{flex:1;border-top:1px solid #999;padding-top:5px;font-size:10px;color:#555}
    @media print{ body{padding:10px} }
  </style></head><body>
    <h1>Giriş Kalite Kontrol Raporu</h1>
    <div class="sub">Rapor No: <b>${esc(i.id)}</b> · Tarih: ${fmtDate(i.date)} · IQC AI Sistemi</div>

    <h2>Ürün & Tedarikçi</h2>
    <div class="kv"><span>Ürün Kodu</span><b>${esc(p.code)}</b></div>
    <div class="kv"><span>Ürün Adı</span><b>${esc(p.name)}</b></div>
    <div class="kv"><span>Teknik Resim Revizyonu</span><b>${esc(i.rev)}</b></div>
    <div class="kv"><span>Tedarikçi</span><b>${esc(s?.name||'—')} (${esc(s?.code||'—')})</b></div>
    <div class="kv"><span>Lot / Parti</span><b>${esc(i.lot)}</b></div>
    <div class="kv"><span>Gelen Miktar</span><b>${i.qty} adet</b></div>
    <div class="kv"><span>Kontrol Eden</span><b>${esc(i.user)}</b></div>
    <div class="kv"><span>AI Güven Oranı</span><b>%${i.confidence||Math.round((i.results[1]?96:0))||96}</b></div>

    <h2>Özet</h2>
    <div class="grid">
      <div class="box"><div class="k">Toplam</div><div class="v">${p.features.length}</div></div>
      <div class="box"><div class="k">OK</div><div class="v ok">${okc}</div></div>
      <div class="box"><div class="k">NOK</div><div class="v nok">${nokc}</div></div>
      <div class="box"><div class="k">Uygunluk</div><div class="v">${p.features.length?Math.round(okc/p.features.length*100):0}%</div></div>
    </div>

    <h2>Ölçüm Sonuçları</h2>
    <table>
      <thead><tr><th>#</th><th>Kontrol Noktası</th><th>Spesifikasyon</th><th>Metod</th><th>AI Ölçüm</th><th>Manuel Ölçüm</th><th>Sonuç</th></tr></thead>
      <tbody>
        ${rows.map(({f,rec,v,r})=>`
          <tr>
            <td>${f.id}</td>
            <td>${esc(f.name)}${f.critical?' <b style="color:#b91c1c">*</b>':''}</td>
            <td style="font-family:monospace">${esc(f.display)} ${esc(f.unit)}</td>
            <td>${esc(f.method)}</td>
            <td style="font-family:monospace">${rec.ai!=null?fmtN(rec.ai):'—'}</td>
            <td style="font-family:monospace">${rec.manual!=null?fmtN(rec.manual):'—'}</td>
            <td class="${r===true?'ok':r===false?'nok':''}">${r===true?'OK':r===false?'NOK':'—'}</td>
          </tr>`).join('')}
      </tbody>
    </table>
    <div style="font-size:9.5px;color:#777;margin-top:6px">* Kritik karakteristik</div>

    <h2>Fotoğraflar</h2>
    <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px">
      ${(p.refImages||[]).slice(0,3).map(r=>`
        <div style="border:1px solid #ccc;border-radius:6px;height:110px;background:${r.color};position:relative;overflow:hidden">
          <div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center">
            <div style="width:58%;height:34%;border:1.5px solid rgba(255,255,255,.7);border-radius:4px"></div>
          </div>
          <span style="position:absolute;bottom:4px;left:6px;font-size:9px;color:#fff;font-weight:700">${esc(r.angle)}</span>
        </div>`).join('')}
    </div>

    <div class="decision">${esc(i.decision)}</div>

    <div class="sign">
      <div>Kontrol Eden — ${esc(i.user)}</div>
      <div>Kalite Onayı</div>
    </div>

    <div class="foot">
      <b>Yasal Uyarı:</b> Bu raporda yer alan AI görüntü ölçüm değerleri karar destek amaçlıdır ve CMM, kumpas, mikrometre veya kalibre edilmiş ölçüm cihazlarının yerine geçmez.
      Kritik ölçülerde manuel ölçüm cihazı sonuçları esas alınmalıdır. Nihai kalite kararı yetkili kalite personeli tarafından onaylanır.<br>
      IQC AI v1.0 · Mock AI Prototip · ${new Date().toLocaleString('tr-TR')}
    </div>
  </body></html>`;

  const w = window.open('', '_blank');
  if(!w){ toast('Açılır pencere engellendi. Tarayıcı izinlerini kontrol edin.','err'); return; }
  w.document.write(html);
  w.document.close();
  setTimeout(()=>{ try{ w.focus(); w.print(); }catch(e){} }, 600);
}

/* =========================================================================
   BOOT
   ========================================================================= */
render();

// Resize handling for AR canvas
let rsz;
window.addEventListener('resize', ()=>{
  clearTimeout(rsz);
  rsz = setTimeout(()=>{ if(route.name==='camera'){ drawScene(); updateLabels(); } }, 180);
});
</script>
</body>
</html>
