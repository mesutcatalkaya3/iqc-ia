<title>IQC AI — Depo Kabul Sistemi</title>
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#0a0e13; --surface:#131b24; --surface2:#1a2430; --surface3:#212d3a;
  --border:#23303e; --border2:#2e3d4e;
  --text:#e8eef6; --muted:#8496ab; --muted2:#5f7285;
  --accent:#00d1b2; --accent-d:#00a88f; --blue:#3b82f6;
  --ok:#22c55e; --nok:#ef4444; --warn:#f59e0b;
  --r:16px; --r-sm:10px;
}
html,body{height:100%}
body{
  background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  font-size:15px;line-height:1.45;overscroll-behavior:none;
  -webkit-font-smoothing:antialiased;
}
#app{display:flex;flex-direction:column;height:100dvh;max-width:600px;margin:0 auto;position:relative;background:var(--bg);overflow:hidden}
#topbar{display:flex;align-items:center;gap:10px;padding:calc(12px + env(safe-area-inset-top)) 14px 12px;border-bottom:1px solid var(--border);background:linear-gradient(180deg,#101a24,#0c131a);position:relative;z-index:30;flex-shrink:0}
#topbar .tb-title{font-size:16px;font-weight:700;letter-spacing:.2px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#topbar .tb-sub{font-size:11px;color:var(--muted);font-weight:500;letter-spacing:.3px}
.iconbtn{width:36px;height:36px;border-radius:11px;border:1px solid var(--border);background:var(--surface);color:var(--text);display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;transition:.15s}
.iconbtn:active{background:var(--surface3);transform:scale(.94)}
.iconbtn svg{width:19px;height:19px}
#screen{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:16px 14px 28px;min-height:0}
body.cam #screen{padding:0;overflow:hidden}
body.cam #tabbar{display:none}
#tabbar{display:flex;border-top:1px solid var(--border);background:#0c131a;padding-bottom:env(safe-area-inset-bottom);flex-shrink:0}
#tabbar button{flex:1;background:none;border:0;color:var(--muted2);padding:8px 0 9px;font-size:10px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;font-family:inherit;transition:.15s;letter-spacing:.2px}
#tabbar button svg{width:21px;height:21px}
#tabbar button.active{color:var(--accent)}
#tabbar button:active{transform:scale(.93)}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:14px;margin-bottom:12px}
.card.tight{padding:11px 13px}
.sec-title{font-size:11.5px;font-weight:700;color:var(--muted);letter-spacing:1.1px;text-transform:uppercase;margin:18px 2px 9px}
.sec-title:first-child{margin-top:2px}
.row{display:flex;align-items:center;gap:10px}
.between{display:flex;align-items:center;justify-content:space-between;gap:10px}
.muted{color:var(--muted)}
.small{font-size:12.5px}
.tiny{font-size:11px}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.badge{display:inline-flex;align-items:center;gap:4px;padding:3px 8px;border-radius:7px;font-size:10.5px;font-weight:700;letter-spacing:.4px;text-transform:uppercase}
.badge.ok{background:rgba(34,197,94,.14);color:#4ade80;border:1px solid rgba(34,197,94,.28)}
.badge.nok{background:rgba(239,68,68,.14);color:#f87171;border:1px solid rgba(239,68,68,.28)}
.badge.wait{background:rgba(245,158,11,.14);color:#fbbf24;border:1px solid rgba(245,158,11,.28)}
.badge.info{background:rgba(59,130,246,.14);color:#7dabf8;border:1px solid rgba(59,130,246,.28)}
.badge.gray{background:rgba(132,150,171,.12);color:var(--muted);border:1px solid var(--border2)}
.badge.ai{background:rgba(0,209,178,.13);color:var(--accent);border:1px solid rgba(0,209,178,.3)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:14px;border-radius:13px;border:1px solid var(--border2);background:var(--surface2);color:var(--text);font-size:14.5px;font-weight:650;font-family:inherit;cursor:pointer;transition:.15s;letter-spacing:.2px}
.btn:active{transform:scale(.98);background:var(--surface3)}
.btn svg{width:18px;height:18px}
.btn.primary{background:linear-gradient(135deg,var(--accent),var(--accent-d));border-color:transparent;color:#04211c;font-weight:750}
.btn.primary:active{filter:brightness(.92)}
.btn.danger{background:rgba(239,68,68,.14);border-color:rgba(239,68,68,.4);color:#f87171}
.btn.ok{background:rgba(34,197,94,.15);border-color:rgba(34,197,94,.4);color:#4ade80}
.btn.warn{background:rgba(245,158,11,.14);border-color:rgba(245,158,11,.38);color:#fbbf24}
.btn.sm{padding:10px 12px;font-size:13px;border-radius:11px;width:auto}
.btn:disabled{opacity:.4;pointer-events:none}
input,select,textarea{width:100%;padding:12px 13px;border-radius:11px;border:1px solid var(--border2);background:var(--surface2);color:var(--text);font-size:14.5px;font-family:inherit;transition:.15s}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);background:#0f1922}
label.fl{display:block;font-size:11.5px;font-weight:650;color:var(--muted);margin:0 0 6px 3px;letter-spacing:.4px;text-transform:uppercase}
.field{margin-bottom:12px}
.hero{background:linear-gradient(135deg,#0f2b2a 0%,#122030 55%,#141c28 100%);border:1px solid #1d3a3c;border-radius:20px;padding:17px;margin-bottom:6px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-40px;top:-40px;width:150px;height:150px;border-radius:50%;background:radial-gradient(circle,rgba(0,209,178,.16),transparent 70%)}
.hero h2{font-size:19px;font-weight:750;letter-spacing:-.2px;margin-bottom:2px}
.hero p{font-size:12.5px;color:var(--muted)}
.hero .who{display:flex;align-items:center;gap:9px;margin-top:14px}
.avatar{width:36px;height:36px;border-radius:11px;background:linear-gradient(135deg,#00d1b2,#0e7490);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;color:#04211c;flex-shrink:0}
.avatar.role{background:linear-gradient(135deg,#3b82f6,#1e40af);color:#fff}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.tile{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:15px 13px;display:flex;flex-direction:column;gap:11px;cursor:pointer;transition:.15s;text-align:left;font-family:inherit;color:var(--text);position:relative;overflow:hidden}
.tile:active{transform:scale(.97);background:var(--surface2);border-color:var(--border2)}
.tile .tico{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;background:var(--surface3);color:var(--accent)}
.tile .tico svg{width:22px;height:22px}
.tile .ttl{font-size:13.5px;font-weight:700;line-height:1.25;letter-spacing:-.1px}
.tile .tdesc{font-size:11px;color:var(--muted2);line-height:1.3}
.tile.wide{grid-column:span 2;flex-direction:row;align-items:center;gap:14px}
.tile.wide .tilebody{flex:1}
.tile.wide .tico{background:linear-gradient(135deg,rgba(0,209,178,.2),rgba(0,209,178,.06));width:46px;height:46px}
.tile.wide .tico svg{width:25px;height:25px}
.li{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--border);border-radius:13px;padding:12px 13px;margin-bottom:9px;cursor:pointer;transition:.15s}
.li:active{background:var(--surface2);transform:scale(.99)}
.li .licon{width:40px;height:40px;border-radius:11px;background:var(--surface3);display:flex;align-items:center;justify-content:center;flex-shrink:0;color:var(--accent)}
.li .licon svg{width:19px;height:19px}
.li .lbody{flex:1;min-width:0}
.li .ltitle{font-size:14px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .lsub{font-size:11.5px;color:var(--muted2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chips{display:flex;gap:7px;overflow-x:auto;padding:2px 0 8px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{padding:7px 13px;border-radius:20px;border:1px solid var(--border2);background:var(--surface);color:var(--muted);font-size:12.5px;font-weight:600;white-space:nowrap;cursor:pointer;font-family:inherit;transition:.15s}
.chip.active{background:rgba(0,209,178,.14);border-color:rgba(0,209,178,.45);color:var(--accent)}
.chip:active{transform:scale(.95)}
.cam{display:flex;flex-direction:column;height:100%;background:#05080b}
.cam-stage{position:relative;flex:1;min-height:0;overflow:hidden;background:#05080b}
.cam-stage video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.85}
.cam-fallback{position:absolute;inset:0;display:none;background:radial-gradient(ellipse at 50% 40%,rgba(0,209,178,.07),transparent 60%),repeating-linear-gradient(0deg,rgba(255,255,255,.022) 0 1px,transparent 1px 42px),repeating-linear-gradient(90deg,rgba(255,255,255,.022) 0 1px,transparent 1px 42px),linear-gradient(160deg,#0d1620,#060a0e)}
.cam-stage.nocam .cam-fallback{display:block}
#arCanvas{position:absolute;inset:0;pointer-events:none}
.ar-labels{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.cam-hud{position:absolute;top:0;left:0;right:0;padding:11px 12px;display:flex;align-items:flex-start;justify-content:space-between;gap:8px;pointer-events:none;z-index:5}
.cam-hud .hud-r{display:flex;flex-direction:column;gap:6px;align-items:flex-end}
.pill{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:9px;background:rgba(8,13,18,.82);border:1px solid var(--border2);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);font-size:10.5px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--muted)}
.pill.live{border-color:rgba(239,68,68,.5);color:#f87171}
.pill.live .dot{width:6px;height:6px;border-radius:50%;background:#ef4444;animation:blink 1.1s infinite}
@keyframes blink{50%{opacity:.25}}
.pill.acc{border-color:rgba(0,209,178,.5);color:var(--accent)}
.scanline{position:absolute;left:0;right:0;height:2px;pointer-events:none;background:linear-gradient(90deg,transparent,var(--accent),transparent);box-shadow:0 0 18px 3px rgba(0,209,178,.55);display:none}
.scanline.on{display:block;animation:scan 1.9s ease-in-out infinite}
@keyframes scan{0%{top:12%;opacity:0}12%{opacity:1}88%{opacity:1}100%{top:88%;opacity:0}}
.cam-panel{flex-shrink:0;background:#0b121a;border-top:1px solid var(--border);padding:12px 14px calc(14px + env(safe-area-inset-bottom));max-height:50%;overflow-y:auto}
.steps{display:flex;gap:5px;margin-bottom:12px}
.steps .st{flex:1;height:3px;border-radius:2px;background:var(--surface3);transition:.3s}
.steps .st.done{background:var(--accent)}
.steps .st.act{background:var(--accent);box-shadow:0 0 8px rgba(0,209,178,.7)}
.progress{height:5px;border-radius:3px;background:var(--surface3);overflow:hidden;margin:9px 0}
.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),#3b82f6);transition:width .4s}
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:100;opacity:0;transition:.22s;backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
.sheet-bg.show{opacity:1}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:101;background:#101923;border-radius:22px 22px 0 0;border-top:1px solid var(--border2);padding:10px 16px calc(20px + env(safe-area-inset-bottom));max-width:600px;margin:0 auto;transform:translateY(102%);transition:transform .28s cubic-bezier(.2,.9,.3,1);max-height:86dvh;overflow-y:auto}
.sheet.show{transform:translateY(0)}
.sheet .grab{width:38px;height:4px;border-radius:3px;background:var(--border2);margin:0 auto 14px}
.tbl{width:100%;border-collapse:collapse;font-size:12.5px}
.tbl th{text-align:left;font-size:10px;font-weight:700;color:var(--muted2);text-transform:uppercase;letter-spacing:.7px;padding:0 8px 8px 0;border-bottom:1px solid var(--border)}
.tbl td{padding:9px 8px 9px 0;border-bottom:1px solid rgba(35,48,62,.6);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl .num{font-family:ui-monospace,monospace;font-weight:650;text-align:right}
.dwg-wrap{background:#0d141c;border:1px solid var(--border);border-radius:var(--r);padding:10px;overflow:hidden}
.dwg-wrap svg{width:100%;height:auto;display:block}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:10px 8px;text-align:center}
.stat .v{font-size:19px;font-weight:800;letter-spacing:-.5px;line-height:1.15}
.stat .k{font-size:9.5px;color:var(--muted2);text-transform:uppercase;letter-spacing:.7px;font-weight:700;margin-top:2px}
.stat.ok .v{color:#4ade80}.stat.nok .v{color:#f87171}
.empty{text-align:center;padding:44px 20px;color:var(--muted2)}
.empty svg{width:44px;height:44px;opacity:.35;margin-bottom:12px}
.empty p{font-size:13px}
.toast{position:fixed;left:50%;bottom:88px;transform:translate(-50%,20px);z-index:200;background:#1b2733;border:1px solid var(--border2);color:var(--text);padding:11px 18px;border-radius:12px;font-size:13px;font-weight:600;box-shadow:0 10px 34px rgba(0,0,0,.6);opacity:0;transition:.25s;pointer-events:none;max-width:88vw;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast.err{border-color:rgba(239,68,68,.5);color:#fca5a5}
.toast.ok{border-color:rgba(34,197,94,.5);color:#86efac}
.toast.warn{border-color:rgba(245,158,11,.5);color:#fbbf24}
.note{background:rgba(245,158,11,.08);border:1px solid rgba(245,158,11,.28);border-radius:11px;padding:10px 12px;font-size:11.5px;color:#fbbf24;line-height:1.5;display:flex;gap:9px}
.note svg{width:16px;height:16px;flex-shrink:0;margin-top:1px}
.note.info{background:rgba(59,130,246,.08);border-color:rgba(59,130,246,.28);color:#93c5fd}
.kv{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px solid rgba(35,48,62,.55);font-size:13px}
.kv:last-child{border-bottom:0}
.kv .k{color:var(--muted)}
.kv .v{font-weight:650;text-align:right}
.hidden{display:none!important}
</style>
</head>

function isOK(f, val){
  if(val==null || isNaN(val)) return null;
  if(f.tolP==null) return true;
  return val >= (f.nominal - f.tolM - 1e-9) && val <= (f.nominal + f.tolP + 1e-9);
}
function effVal(rec){ return rec==null ? null : (rec.manual!=null ? rec.manual : rec.ai); }
function toast(msg, type=''){
  const t = $('#toast');
  t.textContent = msg;
  t.className = 'toast show ' + type;
  clearTimeout(t._t);
  t._t = setTimeout(()=>t.className='toast', 2600);
}
function esc(s){
  return String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

/* ---------- File helpers ---------- */
function readAsDataURL(file){
  return new Promise((res,rej)=>{
    const r = new FileReader();
    r.onload = ()=>res(r.result);
    r.onerror = rej;
    r.readAsDataURL(file);
  });
}
function compressImage(file, maxDim, quality){
  return new Promise((res,rej)=>{
    const r = new FileReader();
    r.onload = ()=>{
      const img = new Image();
      img.onload = ()=>{
        let w = img.width, h = img.height;
        if(w>h && w>maxDim){ h = h*maxDim/w; w = maxDim; }
        else if(h>maxDim){ w = w*maxDim/h; h = maxDim; }
        const c = document.createElement('canvas');
        c.width = w; c.height = h;
        c.getContext('2d').drawImage(img,0,0,w,h);
        res(c.toDataURL('image/jpeg', quality));
      };
      img.onerror = rej;
      img.src = r.result;
    };
    r.onerror = rej;
    r.readAsDataURL(file);
  });
}

  $('#screen').innerHTML = R ? R.html() : '<div class="empty"><p>Ekran bulunamadı</p></div>';

  const g = e.target.closest('[data-go]');
  if(g){ go(g.dataset.go, JSON.parse(g.dataset.params||'{}')); return; }
  const a = e.target.closest('[data-act]');
  if(a){
    const act = a.dataset.act;
    if(act==='back') go(a.dataset.to||'home');
    if(act==='closeCam'){ stopCamera(); go('home'); }
    if(act==='toast') toast(a.dataset.msg||'Bilgi');
  }
});

      </div>
    </div>
    <button class="btn primary" id="np_save">${I.check} Ürünü Kaydet</button>`;
  },
  mount(){
    const box = $('#np_dwg_box'), input = $('#np_dwg_input'), prev = $('#np_dwg_preview');
    box.onclick = ()=>input.click();
    input.onchange = async (e)=>{
      const f = e.target.files[0];
      if(!f) return;
      if(f.size > 15*1024*1024){ toast('Dosya çok büyük (max 15MB)','err'); return; }
      toast('Dosya işleniyor…');
      try{
        if(f.type.startsWith('image/')){
          const d = await compressImage(f, 1000, 0.72);
          SCREENS.productNew._dwgData = d;
          SCREENS.productNew._dwgType = 'image';
          SCREENS.productNew._dwgName = f.name;
          prev.innerHTML = '<div style="position:relative;border-radius:12px;overflow:hidden;border:1px solid var(--border)">' +
            '<img src="' + d + '" style="width:100%;display:block">' +
            '<button id="np_dwg_del" style="position:absolute;top:8px;right:8px;width:32px;height:32px;border-radius:9px;background:rgba(239,68,68,.92);border:0;color:#fff;font-size:20px;font-weight:700;cursor:pointer;line-height:1">×</button></div>' +
            '<div class="tiny muted" style="margin-top:6px">' + esc(f.name) + ' · ' + (d.length/1024).toFixed(0) + ' KB</div>';
          toast('Teknik resim yüklendi','ok');
        } else if(f.type === 'application/pdf'){
          if(f.size > 3*1024*1024){ toast('PDF çok büyük (max 3MB). Resim olarak deneyin.','err'); return; }
          const d = await readAsDataURL(f);
          SCREENS.productNew._dwgData = d;
          SCREENS.productNew._dwgType = 'pdf';
          SCREENS.productNew._dwgName = f.name;
          prev.innerHTML = '<div style="border:1px solid var(--border);border-radius:12px;padding:12px;display:flex;align-items:center;gap:12px">' +
            '<div style="width:44px;height:44px;background:rgba(239,68,68,.15);color:#f87171;border-radius:11px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:11px">PDF</div>' +
            '<div style="flex:1;min-width:0"><div style="font-weight:650;font-size:13px">' + esc(f.name) + '</div><div class="tiny muted">' + (f.size/1024).toFixed(0) + ' KB</div></div>' +
            '<button id="np_dwg_del" style="width:32px;height:32px;border-radius:9px;background:rgba(239,68,68,.15);border:1px solid rgba(239,68,68,.4);color:#f87171;font-size:20px;font-weight:700;cursor:pointer;line-height:1">×</button></div>';
          toast('Teknik resim (PDF) yüklendi','ok');
        } else { toast('Desteklenmeyen dosya türü. Resim veya PDF seçin.','err'); return; }
        box.style.borderColor = 'rgba(34,197,94,.5)';
        box.style.color = '#4ade80';
        const del = $('#np_dwg_del');
        if(del) del.onclick = (ev)=>{
          ev.stopPropagation();
          SCREENS.productNew._dwgData = null;
          SCREENS.productNew._dwgType = null;
          SCREENS.productNew._dwgName = null;
          input.value = '';
          prev.innerHTML = '';
          box.style.borderColor = '';
          box.style.color = '';
        };
      }catch(err){ console.error(err); toast('Dosya okunamadı','err'); }
    };
    $('#np_save').onclick = ()=>{
      const code = $('#np_code').value.trim();
      const name = $('#np_name').value.trim();
      if(!code || !name){ toast('Ürün kodu ve adı zorunlu','err'); return; }
      if(!SCREENS.productNew._dwgData){ toast('Teknik resim yüklenmedi. AI tanıma için gereklidir.','warn'); }
      const p = {
        id: uid('P'), code, name, rev: $('#np_rev').value.trim()||'R01',
        supplierId: $('#np_sup').value,
        material: $('#np_mat').value.trim()||'—',
        weight: '—', surface: '—',
        techDrawing: SCREENS.productNew._dwgData,
        techDrawingType: SCREENS.productNew._dwgType,
        techDrawingName: SCREENS.productNew._dwgName,
        geom:{W:150,H:60,R:10,holes:[{x:52.5,y:30,d:20},{x:97.5,y:30,d:20}]},
        refImages:[{angle:'Ön',color:'#2a3b4d'},{angle:'Arka',color:'#26343f'},{angle:'Sağ',color:'#2d3f52'},{angle:'Sol',color:'#283744'},{angle:'Üst',color:'#31445a'},{angle:'Alt',color:'#243240'},{angle:'Perspektif',color:'#35495f'}],
        features:[
          {id:1,name:'Parça Boyu',display:'150.00 ±0.50',nominal:150,tolP:0.50,tolM:0.50,unit:'mm',type:'Uzunluk',method:'Kumpas',freq:'%100',critical:false,ar:{x:75,y:60,lx:98,ly:76}},
          {id:2,name:'Parça Genişliği',display:'60.00 ±0.30',nominal:60,tolP:0.30,tolM:0.30,unit:'mm',type:'Uzunluk',method:'Kumpas',freq:'%100',critical:false,ar:{x:150,y:30,lx:180,ly:30}},
          {id:3,name:'Et Kalınlığı',display:'8.00 ±0.05',nominal:8,tolP:0.05,tolM:0.05,unit:'mm',type:'Kalınlık',method:'Mikrometre',freq:'%100',critical:true,ar:{x:0,y:30,lx:-26,ly:30}}
        ]
      };
      S.products.push(p);
      try{ persist(); }catch(e){ toast(e.message,'err'); return; }
      SCREENS.productNew._dwgData = null;
      SCREENS.productNew._dwgType = null;

      toast('Ürün kaydedildi','ok');

/* ============ QR/BARKOD ============ */
async function detectQRFromVideo(video){
  try{
    if('BarcodeDetector' in window){
      try{
        const formats = await BarcodeDetector.getSupportedFormats();
        const wanted = ['qr_code','code_128','code_39','ean_13','data_matrix','pdf417'];
        const use = wanted.filter(f => formats.includes(f));
        if(use.length){
          const det = new BarcodeDetector({formats: use});
          const codes = await det.detect(video);
          if(codes && codes.length){
            return codes.map(c => ({
              raw: c.rawValue,
              format: c.format,
              bbox: {
                x: c.boundingBox.x / video.videoWidth,
                y: c.boundingBox.y / video.videoHeight,
                w: c.boundingBox.width / video.videoWidth,
                h: c.boundingBox.height / video.videoHeight
              }
            }));
          }
          return [];
        }
      }catch(e){}
    }
    if(typeof jsQR !== 'function') return [];
    const canvas = document.createElement('canvas');
    canvas.width = 640;
    canvas.height = Math.round(video.videoHeight * (640/video.videoWidth));
    const ctx = canvas.getContext('2d');
    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
    const img = ctx.getImageData(0, 0, canvas.width, canvas.height);
    const code = jsQR(img.data, img.width, img.height, {inversionAttempts:'dontInvert'});
    if(!code) return [];
    return [{
      raw: code.data,
      format: 'qr_code',
      bbox: {
        x: code.location.topLeftCorner.x / canvas.width,
        y: code.location.topLeftCorner.y / canvas.height,
        w: (code.location.topRightCorner.x - code.location.topLeftCorner.x) / canvas.width,
        h: (code.location.bottomLeftCorner.y - code.location.topLeftCorner.y) / canvas.height
      }
    }];
  }catch(e){ console.warn('QR hata:', e); return []; }
}

function parseQRToProduct(qrText){
  if(!qrText) return null;
  const clean = String(qrText).trim().toUpperCase();
  for(const p of S.products){
    if(clean === p.code.toUpperCase()) return {product: p, lot: null, raw: qrText};
    const parts = clean.split(/[|;,\s]+/);
    if(parts.includes(p.code.toUpperCase())){
      const i = parts.indexOf(p.code.toUpperCase()) + 1;
      return {product: p, lot: parts[i] || null, raw: qrText};
    }
  }
  for(const p of S.products){
    if(clean.includes(p.code.toUpperCase())) return {product: p, lot: null, raw: qrText};
  }
  return null;
}

/* ============ GEMINI AI ============ */
const GEMINI_PROMPT = 'Sen bir endüstriyel depo kabul asistanısın. KAMERA FOTOĞRAFINDAKİ her parçayı ayrı ayrı bul ve REFERANS TEKNİK RESİMLERDEN hangisine ait olduğunu belirle.\n\nKURALLAR:\n1. Fotoğrafta gördüğün HER parçayı listele\n2. Her parça için eşleşen referans kodunu yaz\n3. Emin değilsen confidence değerini düşür (0-100)\n4. Sınırlayıcı kutuyu oransal koordinatlarla ver: x=sol, y=üst, w=genişlik, h=yükseklik (0.0-1.0 arası)\n5. Benzer parçaları karıştırma\n6. Eşleşmeyen parça için reference=null\n7. SADECE JSON döndür\n\nFORMAT:\n{"products":[{"reference":"BRK-125","confidence":92,"bbox":{"x":0.15,"y":0.25,"w":0.30,"h":0.35},"notes":"Braket"}],"summary":"1 parça bulundu"}';

async function runGeminiScan(video){
  const apiKey = S.settings.geminiKey;
  if(!apiKey) throw new Error('Gemini API anahtarı girilmedi');
  const refs = S.products.filter(p => p.techDrawing);
  if(refs.length === 0) throw new Error('Teknik resim yüklü ürün yok');

  const canvas = document.createElement('canvas');
  const W = 800;
  const H = Math.round(video.videoHeight * (W / video.videoWidth));
  canvas.width = W; canvas.height = H;
  canvas.getContext('2d').drawImage(video, 0, 0, W, H);
  const frameData = canvas.toDataURL('image/jpeg', 0.75).split(',')[1];

  const parts = [];
  parts.push({text: 'KAMERA FOTOĞRAFI:\n'});
  parts.push({inline_data: {mime_type: 'image/jpeg', data: frameData}});
  parts.push({text: '\n\nREFERANS TEKNİK RESİMLER:\n'});
  alert('📊 Gönderilecek:\n\nKamera görsel: ' + Math.round(frameData.length/1024) + ' KB\nReferans sayısı: ' + refs.length + '\nİlk referans: ' + (refs[0]?.code || 'YOK') + '\nİlk referans boyutu: ' + (refs[0]?.techDrawing ? Math.round(refs[0].techDrawing.length/1024) + ' KB' : 'YOK'));
  refs.forEach((r, i) => {
    parts.push({text: '\n[REFERANS ' + (i+1) + '] Kod: ' + r.code + ' | Ad: ' + r.name + '\n'});
    const m = r.techDrawing.match(/^data:([^;]+);base64,(.+)$/);
    if(m) parts.push({inline_data: {mime_type: m[1], data: m[2]}});
  });
  parts.push({text: '\n\n' + GEMINI_PROMPT});

  const url = 'https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=' + apiKey;
  const resp = await fetch(url, {
    method: 'POST',
    headers: {'Content-Type':'application/json'},
    body: JSON.stringify({
      contents: [{parts: parts}],
      generationConfig: {temperature: 0.1, responseMimeType: 'application/json'}
    })
  });
  if(!resp.ok){
    const t = await resp.text();
    console.error('Gemini error:', t);
    throw new Error('Gemini HTTP ' + resp.status);
  }
  const data = await resp.json();
  if(!data.candidates || !data.candidates[0]) throw new Error('Gemini yanıt yok');
  const txt = data.candidates[0].content.parts[0].text;
  // DEBUG: Gemini'nin ham yanıtını göster
alert('🔵 GEMINI YANITI:\n\n' + txt.substring(0, 1500));
  let result;
  try { result = JSON.parse(txt); }
  catch(e){
    const m = txt.match(/\{[\s\S]*\}/);
    if(m) result = JSON.parse(m[0]);
    else throw new Error('JSON parse hatası');
  }
  return result;
}

/* ============ HIBRIT TARAMA ============ */
async function runHybridScan(){
  const video = $('#camVideo');
  if(!video || !video.videoWidth){ toast('Kamera hazır değil','err'); return; }
  const mode = S.settings.scanMode || 'hybrid';
  if(mode === 'manual'){ openProductPicker(); return; }

  cam.phase = 'scanning';
  cam.detections = [];
  cam.scanSummary = '';
  updateCamUI();

  const t0 = Date.now();
  try{
    // 1. QR
    let qrResults = [];
    if(mode === 'hybrid' || mode === 'qr'){
      qrResults = await detectQRFromVideo(video);
    }
    const qrDets = [];
    for(const qr of qrResults){
      const parsed = parseQRToProduct(qr.raw);
      if(parsed && parsed.product){
        qrDets.push({
          reference: parsed.product.code,
          confidence: 100,
          method: 'QR',
          bbox: qr.bbox,
          raw: qr.raw,
          lot: parsed.lot,
          notes: 'QR kod ile okundu',
          productId: parsed.product.id
        });
      } else if(qr.raw){
        qrDets.push({
          reference: null, confidence: 100, method: 'QR',
          bbox: qr.bbox, raw: qr.raw, lot: null,
          notes: 'QR okundu ama ürün sistemde yok: ' + qr.raw,
          productId: null
        });
      }
    }

    // 2. AI
    let aiDets = [];
    const shouldRunAI = (mode === 'hybrid' && qrDets.filter(d=>d.reference).length === 0) || mode === 'ai';
    if(shouldRunAI && S.settings.geminiKey){
      try{
        const aiRes = await runGeminiScan(video);
        aiDets = (aiRes.products || []).filter(p => p.reference).map(p => {
          const prod = S.products.find(x => x.code === p.reference);
          return {
            reference: p.reference,
            confidence: p.confidence || 70,
            method: 'AI',
            bbox: p.bbox,
            raw: null,
            lot: null,
            notes: p.notes || 'Gemini AI ile tanımlandı',
            productId: prod ? prod.id : null
          };
        });
        cam.scanSummary = aiRes.summary || '';
        console.log('🔵 GEMINI RAW RESPONSE:', JSON.stringify(aiRes, null, 2));
console.log('🔵 DETECTED:', aiDets.length, 'ürün');
if(aiDets.length === 0) console.log('🔵 SORUN: Gemini hiç ürün eşleştirmedi. Response:', aiRes);
      }catch(e){
        console.warn('Gemini hata:', e);
        toast('AI hatası: ' + e.message, 'warn');
      }
    }

    // 3. Birleştir
    const all = [...qrDets];
    if(qrDets.length > 0 && aiDets.length > 0){
      qrDets.forEach(qr=>{
        const match = aiDets.find(ai => ai.reference === qr.reference);
        if(match){
          qr.notes = '✅ QR + AI teyit edildi (AI: %' + match.confidence + ')';
        } else {
          qr.notes = '⚠ QR okundu, AI farklı gösteriyor';
        }
      });
      aiDets.forEach(ai => {
        if(!qrDets.find(qr => qr.reference === ai.reference)) all.push(ai);
      });
    } else if(qrDets.length === 0){
      all.push(...aiDets);
    }

    cam.detections = all;
    cam.scanDuration = Date.now() - t0;
    cam.phase = 'scanned';
    updateCamUI();

    if(all.length === 0){
      toast('Hiçbir ürün tanımlanamadı','warn');
    } else {
      const qc = all.filter(d => d.method === 'QR').length;
      const ac = all.filter(d => d.method === 'AI').length;
      toast(qc + ' QR + ' + ac + ' AI = ' + all.length + ' ürün','ok');
    }
}catch(e){
  console.error('Tarama hata:', e);
  cam.phase = 'scanned';
  updateCamUI();
  // HATA DETAYI ekranda göster
  setTimeout(()=>{
    alert('🔴 TARAMA HATASI\n\nMesaj: ' + e.message + '\n\nDetay: ' + (e.stack || 'yok'));
  }, 500);
}
}

/* ============ DRAW ============ */
function drawScene(){
  const stage = $('#camStage');
  if(!stage || !cam) return;
  const cv = $('#arCanvas');
  const W = stage.clientWidth, H = stage.clientHeight;
  if(!W || !H) return;
  const dpr = Math.min(window.devicePixelRatio||1, 2);
  cv.width = W*dpr; cv.height = H*dpr;
  cv.style.width = W+'px'; cv.style.height = H+'px';
  const ctx = cv.getContext('2d');
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.clearRect(0,0,W,H);
  if(cam.phase === 'scanning'){ drawGrid(ctx,W,H); return; }
  drawDetectionBoxes(ctx, W, H);
}
function drawDetectionBoxes(ctx, W, H){
  if(!cam || !cam.detections) return;
  cam.detections.forEach(det=>{
    if(!det.bbox) return;
    const bx = det.bbox.x * W, by = det.bbox.y * H;
    const bw = det.bbox.w * W, bh = det.bbox.h * H;
    const color = det.method === 'QR' ? '#22c55e' : det.method === 'AI' ? '#00d1b2' : '#f59e0b';
    const bgColor = det.method === 'QR' ? 'rgba(34,197,94,.10)' : det.method === 'AI' ? 'rgba(0,209,178,.10)' : 'rgba(245,158,11,.10)';
    ctx.strokeStyle = color; ctx.lineWidth = 3; ctx.setLineDash([]);
    ctx.strokeRect(bx, by, bw, bh);
    ctx.fillStyle = bgColor; ctx.fillRect(bx, by, bw, bh);
    const L = Math.min(22, bw*0.25, bh*0.25);
    ctx.strokeStyle = color; ctx.lineWidth = 4; ctx.lineCap = 'round';
    [[bx,by,1,1],[bx+bw,by,-1,1],[bx,by+bh,1,-1],[bx+bw,by+bh,-1,-1]].forEach(p=>{
      ctx.beginPath();
      ctx.moveTo(p[0]+p[2]*L, p[1]); ctx.lineTo(p[0], p[1]); ctx.lineTo(p[0], p[1]+p[3]*L);
      ctx.stroke();
    });
    const label = (det.reference || '?') + '  ' + det.method + ' %' + det.confidence;
    ctx.font = 'bold 15px -apple-system,Arial,sans-serif';
    const tw = ctx.measureText(label).width + 22;
    const th = 32;
    const lx = Math.max(0, Math.min(W-tw, bx));
    const ly = Math.max(th, by - 4);
    ctx.fillStyle = color; ctx.fillRect(lx, ly-th, tw, th);
    ctx.fillStyle = '#04211c'; ctx.fillText(label, lx+11, ly-11);
  });
}
function drawGrid(ctx,W,H){
  ctx.strokeStyle = 'rgba(0,209,178,.09)'; ctx.lineWidth = 1;
  const g = 48;
  for(let x=0;x<W;x+=g){ ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,H); ctx.stroke(); }
  for(let y=0;y<H;y+=g){ ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(W,y); ctx.stroke(); }
}
function arLoop(){
  drawScene();
  rafId = requestAnimationFrame(arLoop);
}

      cam.phase = 'scanned';

/* ============ SVG DRAWING ============ */
function drawingSVG(p){
  const G = p.geom || {W:150,H:60,R:10,holes:[]};
  const VB_W = 560, VB_H = 340;
  const areaX = 30, areaY = 24, areaW = 380, areaH = 200;
  const scale = Math.min(areaW/G.W, areaH/G.H);
  const pw = G.W*scale, ph = G.H*scale;
  const ox = areaX + (areaW-pw)/2;
  const oy = areaY + (areaH-ph)/2;
  const X = mm => ox + mm*scale;
  const Y = mm => oy + mm*scale;
  const holes = (G.holes||[]).map(h =>
    '<circle cx="' + X(h.x).toFixed(1) + '" cy="' + Y(h.y).toFixed(1) + '" r="' + (h.d/2*scale).toFixed(1) + '" fill="#0a1119" stroke="#5fd6c4" stroke-width="1.1"/>' +
    '<line x1="' + (X(h.x)-3).toFixed(1) + '" y1="' + Y(h.y).toFixed(1) + '" x2="' + (X(h.x)+3).toFixed(1) + '" y2="' + Y(h.y).toFixed(1) + '" stroke="#5fd6c4" stroke-width=".8"/>' +
    '<line x1="' + X(h.x).toFixed(1) + '" y1="' + (Y(h.y)-3).toFixed(1) + '" x2="' + X(h.x).toFixed(1) + '" y2="' + (Y(h.y)+3).toFixed(1) + '" stroke="#5fd6c4" stroke-width=".8"/>'
  ).join('');
  return '<svg viewBox="0 0 ' + VB_W + ' ' + VB_H + '" xmlns="http://www.w3.org/2000/svg" style="background:#0d141c;border-radius:8px">' +
    '<defs><pattern id="gp" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M20 0H0V20" fill="none" stroke="#182430" stroke-width=".6"/></pattern></defs>' +
    '<rect width="' + VB_W + '" height="' + VB_H + '" fill="url(#gp)" opacity=".6"/>' +
    '<rect x="' + ox + '" y="' + oy + '" width="' + pw + '" height="' + ph + '" rx="' + (G.R*scale).toFixed(1) + '" fill="#16202b" stroke="#7fd8c8" stroke-width="1.6"/>' +
    holes +
    '<text x="' + X(0) + '" y="' + (Y(G.H)+20) + '" fill="#8fd8c9" font-size="10.5" font-family="monospace">' + G.W.toFixed(2) + '</text>' +
    '<text x="' + (X(G.W)+5) + '" y="' + Y(G.H/2) + '" fill="#8fd8c9" font-size="10.5" font-family="monospace">' + G.H.toFixed(2) + '</text>' +
    '<g transform="translate(' + (VB_W-190) + ',' + (VB_H-108) + ')">' +
      '<rect x="0" y="0" width="180" height="98" fill="#111a24" stroke="#2a3a4a" stroke-width="1"/>' +
      '<line x1="0" y1="26" x2="180" y2="26" stroke="#2a3a4a"/>' +
      '<line x1="0" y1="50" x2="180" y2="50" stroke="#2a3a4a"/>' +
      '<line x1="0" y1="74" x2="180" y2="74" stroke="#2a3a4a"/>' +
      '<text x="8" y="17" fill="#e2eef7" font-size="12" font-weight="700" font-family="monospace">' + esc(p.code) + '</text>' +
      '<text x="8" y="41" fill="#7f97a8" font-size="10" font-family="monospace">' + esc(p.name) + '</text>' +
      '<text x="8" y="65" fill="#7f97a8" font-size="10" font-family="monospace">MALZ: ' + esc(p.material||'-') + '</text>' +
      '<text x="8" y="89" fill="#00d1b2" font-size="11" font-weight="700" font-family="monospace">REV ' + esc(p.rev) + '</text>' +
      '<text x="96" y="89" fill="#7f97a8" font-size="9" font-family="monospace">mm / ISO 2768-m</text>' +
    '</g>' +
  '</svg>';
}
