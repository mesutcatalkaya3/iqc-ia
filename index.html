<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0a0e13">
<title>IQC AI - Giris Kalite Kontrol</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#0a0e13; --surface:#131b24; --surface2:#1a2430; --surface3:#212d3a;
  --border:#23303e; --border2:#2e3d4e;
  --text:#e8eef6; --muted:#8496ab; --muted2:#5f7285;
  --accent:#00d1b2; --accent-d:#00a88f; --blue:#3b82f6;
  --ok:#22c55e; --nok:#ef4444; --warn:#f59e0b;
  --r:16px; --r-sm:10px;
}
html,body{height:100%}
body{
  background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  font-size:15px;line-height:1.45;overscroll-behavior:none;
  -webkit-font-smoothing:antialiased;
}
#app{display:flex;flex-direction:column;height:100dvh;max-width:600px;margin:0 auto;position:relative;background:var(--bg);overflow:hidden}
#topbar{
  display:flex;align-items:center;gap:10px;
  padding:calc(12px + env(safe-area-inset-top)) 14px 12px;
  border-bottom:1px solid var(--border);
  background:linear-gradient(180deg,#101a24,#0c131a);
  position:relative;z-index:30;flex-shrink:0;
}
#topbar .tb-title{font-size:16px;font-weight:700;letter-spacing:.2px;flex:1;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#topbar .tb-sub{font-size:11px;color:var(--muted);font-weight:500;letter-spacing:.3px}
.iconbtn{
  width:36px;height:36px;border-radius:11px;border:1px solid var(--border);
  background:var(--surface);color:var(--text);display:flex;align-items:center;justify-content:center;
  cursor:pointer;flex-shrink:0;transition:.15s;
}
.iconbtn:active{background:var(--surface3);transform:scale(.94)}
.iconbtn svg{width:19px;height:19px}
#screen{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:16px 14px 28px;min-height:0}
body.cam #screen{padding:0;overflow:hidden}
body.cam #tabbar{display:none}
#tabbar{
  display:flex;border-top:1px solid var(--border);background:#0c131a;
  padding-bottom:env(safe-area-inset-bottom);flex-shrink:0;
}
#tabbar button{
  flex:1;background:none;border:0;color:var(--muted2);padding:8px 0 9px;
  font-size:10px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:3px;
  cursor:pointer;font-family:inherit;transition:.15s;letter-spacing:.2px;
}
#tabbar button svg{width:21px;height:21px}
#tabbar button.active{color:var(--accent)}
#tabbar button:active{transform:scale(.93)}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:14px;margin-bottom:12px}
.card.tight{padding:11px 13px}
.sec-title{font-size:11.5px;font-weight:700;color:var(--muted);letter-spacing:1.1px;
  text-transform:uppercase;margin:18px 2px 9px}
.sec-title:first-child{margin-top:2px}
.row{display:flex;align-items:center;gap:10px}
.between{display:flex;align-items:center;justify-content:space-between;gap:10px}
.muted{color:var(--muted)}
.small{font-size:12.5px}
.tiny{font-size:11px}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.badge{display:inline-flex;align-items:center;gap:4px;padding:3px 8px;border-radius:7px;
  font-size:10.5px;font-weight:700;letter-spacing:.4px;text-transform:uppercase}
.badge.ok{background:rgba(34,197,94,.14);color:#4ade80;border:1px solid rgba(34,197,94,.28)}
.badge.nok{background:rgba(239,68,68,.14);color:#f87171;border:1px solid rgba(239,68,68,.28)}
.badge.wait{background:rgba(245,158,11,.14);color:#fbbf24;border:1px solid rgba(245,158,11,.28)}
.badge.info{background:rgba(59,130,246,.14);color:#7dabf8;border:1px solid rgba(59,130,246,.28)}
.badge.gray{background:rgba(132,150,171,.12);color:var(--muted);border:1px solid var(--border2)}
.badge.ai{background:rgba(0,209,178,.13);color:var(--accent);border:1px solid rgba(0,209,178,.3)}
.btn{
  display:flex;align-items:center;justify-content:center;gap:8px;width:100%;
  padding:14px;border-radius:13px;border:1px solid var(--border2);background:var(--surface2);
  color:var(--text);font-size:14.5px;font-weight:650;font-family:inherit;cursor:pointer;
  transition:.15s;letter-spacing:.2px;
}
.btn:active{transform:scale(.98);background:var(--surface3)}
.btn svg{width:18px;height:18px}
.btn.primary{background:linear-gradient(135deg,var(--accent),var(--accent-d));border-color:transparent;color:#04211c;font-weight:750}
.btn.primary:active{filter:brightness(.92)}
.btn.danger{background:rgba(239,68,68,.14);border-color:rgba(239,68,68,.4);color:#f87171}
.btn.ok{background:rgba(34,197,94,.15);border-color:rgba(34,197,94,.4);color:#4ade80}
.btn.warn{background:rgba(245,158,11,.14);border-color:rgba(245,158,11,.38);color:#fbbf24}
.btn.sm{padding:10px 12px;font-size:13px;border-radius:11px;width:auto}
.btn:disabled{opacity:.4;pointer-events:none}
input,select,textarea{
  width:100%;padding:12px 13px;border-radius:11px;border:1px solid var(--border2);
  background:var(--surface2);color:var(--text);font-size:14.5px;font-family:inherit;
  transition:.15s;
}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);background:#0f1922}
label.fl{display:block;font-size:11.5px;font-weight:650;color:var(--muted);
  margin:0 0 6px 3px;letter-spacing:.4px;text-transform:uppercase}
.field{margin-bottom:12px}
.hero{
  background:linear-gradient(135deg,#0f2b2a 0%,#122030 55%,#141c28 100%);
  border:1px solid #1d3a3c;border-radius:20px;padding:17px;margin-bottom:6px;position:relative;overflow:hidden;
}
.hero::after{content:"";position:absolute;right:-40px;top:-40px;width:150px;height:150px;
  border-radius:50%;background:radial-gradient(circle,rgba(0,209,178,.16),transparent 70%)}
.hero h2{font-size:19px;font-weight:750;letter-spacing:-.2px;margin-bottom:2px}
.hero p{font-size:12.5px;color:var(--muted)}
.hero .who{display:flex;align-items:center;gap:9px;margin-top:14px}
.avatar{width:36px;height:36px;border-radius:11px;background:linear-gradient(135deg,#00d1b2,#0e7490);
  display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;color:#04211c;flex-shrink:0}
.avatar.role{background:linear-gradient(135deg,#3b82f6,#1e40af);color:#fff}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.tile{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--r);
  padding:15px 13px;display:flex;flex-direction:column;gap:11px;cursor:pointer;
  transition:.15s;text-align:left;font-family:inherit;color:var(--text);position:relative;overflow:hidden;
}
.tile:active{transform:scale(.97);background:var(--surface2);border-color:var(--border2)}
.tile .tico{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;
  background:var(--surface3);color:var(--accent)}
.tile .tico svg{width:22px;height:22px}
.tile .ttl{font-size:13.5px;font-weight:700;line-height:1.25;letter-spacing:-.1px}
.tile .tdesc{font-size:11px;color:var(--muted2);line-height:1.3}
.tile.wide{grid-column:span 2;flex-direction:row;align-items:center;gap:14px}
.tile.wide .tilebody{flex:1}
.tile.wide .tico{background:linear-gradient(135deg,rgba(0,209,178,.2),rgba(0,209,178,.06));width:46px;height:46px}
.tile.wide .tico svg{width:25px;height:25px}
.li{
  display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--border);
  border-radius:13px;padding:12px 13px;margin-bottom:9px;cursor:pointer;transition:.15s;
}
.li:active{background:var(--surface2);transform:scale(.99)}
.li .licon{width:40px;height:40px;border-radius:11px;background:var(--surface3);
  display:flex;align-items:center;justify-content:center;flex-shrink:0;color:var(--accent)}
.li .licon svg{width:19px;height:19px}
.li .lbody{flex:1;min-width:0}
.li .ltitle{font-size:14px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .lsub{font-size:11.5px;color:var(--muted2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chips{display:flex;gap:7px;overflow-x:auto;padding:2px 0 8px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{
  padding:7px 13px;border-radius:20px;border:1px solid var(--border2);background:var(--surface);
  color:var(--muted);font-size:12.5px;font-weight:600;white-space:nowrap;cursor:pointer;
  font-family:inherit;transition:.15s;
}
.chip.active{background:rgba(0,209,178,.14);border-color:rgba(0,209,178,.45);color:var(--accent)}
.chip:active{transform:scale(.95)}
.cam{display:flex;flex-direction:column;height:100%;background:#05080b}
.cam-stage{position:relative;flex:1;min-height:0;overflow:hidden;background:#05080b}
.cam-stage video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.85}
.cam-fallback{position:absolute;inset:0;display:none;
  background:
    radial-gradient(ellipse at 50% 40%,rgba(0,209,178,.07),transparent 60%),
    repeating-linear-gradient(0deg,rgba(255,255,255,.022) 0 1px,transparent 1px 42px),
    repeating-linear-gradient(90deg,rgba(255,255,255,.022) 0 1px,transparent 1px 42px),
    linear-gradient(160deg,#0d1620,#060a0e);
}
.cam-stage.nocam .cam-fallback{display:block}
#arCanvas{position:absolute;inset:0;pointer-events:none}
.ar-labels{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.ar-label{
  position:absolute;transform:translate(-50%,-50%);pointer-events:auto;cursor:pointer;
  display:flex;align-items:center;gap:6px;padding:5px 9px 5px 5px;border-radius:9px;
  background:rgba(10,16,22,.88);border:1px solid rgba(0,209,178,.55);
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  font-size:11px;font-weight:650;color:#dff8f4;white-space:nowrap;font-family:inherit;
  box-shadow:0 4px 16px rgba(0,0,0,.5);transition:background .2s,border-color .2s;
}
.ar-label .ar-num{
  width:17px;height:17px;border-radius:50%;background:var(--accent);color:#04211c;
  display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:800;flex-shrink:0;
}
.ar-label .ar-val{color:var(--accent);font-weight:750;font-family:ui-monospace,monospace;font-size:10.5px}
.ar-label.ok{border-color:rgba(34,197,94,.6)}
.ar-label.ok .ar-num{background:var(--ok);color:#03210e}
.ar-label.ok .ar-val{color:#4ade80}
.ar-label.nok{border-color:rgba(239,68,68,.75);background:rgba(30,8,8,.9)}
.ar-label.nok .ar-num{background:var(--nok);color:#fff}
.ar-label.nok .ar-val{color:#f87171}
.ar-label.sel{outline:2px solid var(--accent);outline-offset:2px}
.cam-hud{position:absolute;top:0;left:0;right:0;padding:11px 12px;display:flex;
  align-items:flex-start;justify-content:space-between;gap:8px;pointer-events:none;z-index:5}
.cam-hud .hud-r{display:flex;flex-direction:column;gap:6px;align-items:flex-end}
.pill{
  display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:9px;
  background:rgba(8,13,18,.82);border:1px solid var(--border2);backdrop-filter:blur(10px);
  -webkit-backdrop-filter:blur(10px);font-size:10.5px;font-weight:700;letter-spacing:.5px;
  text-transform:uppercase;color:var(--muted);
}
.pill.live{border-color:rgba(239,68,68,.5);color:#f87171}
.pill.live .dot{width:6px;height:6px;border-radius:50%;background:#ef4444;animation:blink 1.1s infinite}
@keyframes blink{50%{opacity:.25}}
.pill.acc{border-color:rgba(0,209,178,.5);color:var(--accent)}
.scanline{position:absolute;left:0;right:0;height:2px;pointer-events:none;
  background:linear-gradient(90deg,transparent,var(--accent),transparent);
  box-shadow:0 0 18px 3px rgba(0,209,178,.55);display:none}
.scanline.on{display:block;animation:scan 1.9s ease-in-out infinite}
@keyframes scan{0%{top:12%;opacity:0}12%{opacity:1}88%{opacity:1}100%{top:88%;opacity:0}}
.cam-panel{
  flex-shrink:0;background:#0b121a;border-top:1px solid var(--border);
  padding:12px 14px calc(14px + env(safe-area-inset-bottom));
  max-height:50%;overflow-y:auto;
}
.steps{display:flex;gap:5px;margin-bottom:12px}
.steps .st{flex:1;height:3px;border-radius:2px;background:var(--surface3);transition:.3s}
.steps .st.done{background:var(--accent)}
.steps .st.act{background:var(--accent);box-shadow:0 0 8px rgba(0,209,178,.7)}
.progress{height:5px;border-radius:3px;background:var(--surface3);overflow:hidden;margin:9px 0}
.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),#3b82f6);transition:width .4s}
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:100;opacity:0;
  transition:.22s;backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
.sheet-bg.show{opacity:1}
.sheet{
  position:fixed;left:0;right:0;bottom:0;z-index:101;background:#101923;
  border-radius:22px 22px 0 0;border-top:1px solid var(--border2);
  padding:10px 16px calc(20px + env(safe-area-inset-bottom));
  max-width:600px;margin:0 auto;transform:translateY(102%);transition:transform .28s cubic-bezier(.2,.9,.3,1);
  max-height:86dvh;overflow-y:auto;
}
.sheet.show{transform:translateY(0)}
.sheet .grab{width:38px;height:4px;border-radius:3px;background:var(--border2);margin:0 auto 14px}
.tbl{width:100%;border-collapse:collapse;font-size:12.5px}
.tbl th{text-align:left;font-size:10px;font-weight:700;color:var(--muted2);
  text-transform:uppercase;letter-spacing:.7px;padding:0 8px 8px 0;border-bottom:1px solid var(--border)}
.tbl td{padding:9px 8px 9px 0;border-bottom:1px solid rgba(35,48,62,.6);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl .num{font-family:ui-monospace,monospace;font-weight:650;text-align:right}
.dwg-wrap{background:#0d141c;border:1px solid var(--border);border-radius:var(--r);
  padding:10px;overflow:hidden}
.dwg-wrap svg{width:100%;height:auto;display:block}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:10px 8px;text-align:center}
.stat .v{font-size:19px;font-weight:800;letter-spacing:-.5px;line-height:1.15}
.stat .k{font-size:9.5px;color:var(--muted2);text-transform:uppercase;letter-spacing:.7px;font-weight:700;margin-top:2px}
.stat.ok .v{color:#4ade80}.stat.nok .v{color:#f87171}
.empty{text-align:center;padding:44px 20px;color:var(--muted2)}
.empty svg{width:44px;height:44px;opacity:.35;margin-bottom:12px}
.empty p{font-size:13px}
.toast{position:fixed;left:50%;bottom:88px;transform:translate(-50%,20px);z-index:200;
  background:#1b2733;border:1px solid var(--border2);color:var(--text);
  padding:11px 18px;border-radius:12px;font-size:13px;font-weight:600;
  box-shadow:0 10px 34px rgba(0,0,0,.6);opacity:0;transition:.25s;pointer-events:none;max-width:88vw;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast.err{border-color:rgba(239,68,68,.5);color:#fca5a5}
.toast.ok{border-color:rgba(34,197,94,.5);color:#86efac}
.toast.warn{border-color:rgba(245,158,11,.5);color:#fbbf24}
.note{background:rgba(245,158,11,.08);border:1px solid rgba(245,158,11,.28);
  border-radius:11px;padding:10px 12px;font-size:11.5px;color:#fbbf24;line-height:1.5;display:flex;gap:9px}
.note svg{width:16px;height:16px;flex-shrink:0;margin-top:1px}
.note.info{background:rgba(59,130,246,.08);border-color:rgba(59,130,246,.28);color:#93c5fd}
.kv{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px solid rgba(35,48,62,.55);font-size:13px}
.kv:last-child{border-bottom:0}
.kv .k{color:var(--muted)}
.kv .v{font-weight:650;text-align:right}
.hidden{display:none!important}
</style>
</head>
<body>
<div id="app">
  <header id="topbar"></header>
  <main id="screen"></main>
  <nav id="tabbar"></nav>
</div>
<div id="sheetRoot"></div>
<div id="toast" class="toast"></div>

<script>
const I = {
  back:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>',

  shield:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l7.5 3v6c0 4.6-3.1 8.2-7.5 9.4C7.6 20.2 4.5 16.6 4.5 12V6L12 3z"/><path d="M9.2 12.2l2 2 3.6-3.8"/></svg>',
  ruler:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="8" width="19" height="8" rx="1.6"/><path d="M7 8v3M11 8v3M15 8v3M19 8v3"/></svg>',
  report:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h8l4 4v14H6z"/><path d="M14 3v4h4M9 12h6M9 16h6"/></svg>',

function isOK(f, val){
  if(val==null || isNaN(val)) return null;
  if(f.tolP==null) return true;
  return val >= (f.nominal - f.tolM - 1e-9) && val <= (f.nominal + f.tolP + 1e-9);
}
function effVal(rec){ return rec==null?null:(rec.manual!=null?rec.manual:rec.ai); }
function toast(msg, type=''){
  const t=$('#toast'); t.textContent=msg; t.className='toast show '+type;
  clearTimeout(t._t); t._t=setTimeout(()=>t.className='toast',2600);
}
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function readAsDataURL(file){
  return new Promise((res,rej)=>{
    const r=new FileReader();
    r.onload=()=>res(r.result);
    r.onerror=rej;
    r.readAsDataURL(file);
  });
}
function compressImage(file,maxDim,quality){
  return new Promise((res,rej)=>{
    const r=new FileReader();
    r.onload=()=>{
      const img=new Image();
      img.onload=()=>{
        let w=img.width,h=img.height;
        if(w>h && w>maxDim){h=h*maxDim/w;w=maxDim;}
        else if(h>maxDim){w=w*maxDim/h;h=maxDim;}
        const c=document.createElement('canvas');
        c.width=w;c.height=h;
        c.getContext('2d').drawImage(img,0,0,w,h);
        res(c.toDataURL('image/jpeg',quality));
      };
      img.onerror=rej;
      img.src=r.result;
    };
    r.onerror=rej;
    r.readAsDataURL(file);
  });
}

          '</div>';

        } else {

        features:[
          {id:1,name:'Parca Boyu',display:'150.00 +/-0.50',nominal:150,tolP:0.50,tolM:0.50,unit:'mm',type:'Uzunluk',method:'Kumpas',freq:'%100',critical:false,ar:{x:75,y:60,lx:98,ly:76}},

let cam = null;
let rafId = null;

function initCam(){
  cam = {
    phase:'searching',
    product:null,
    confidence:0,
    targetConf:0,
    calibrated:false,
    refFound:false,
    pxPerMM:0,
    measurements:{},
    selected:null,
    stream:null,
    t0: Date.now()
  };
}
function stopCamera(){
  if(cam && cam.stream){ cam.stream.getTracks().forEach(t=>t.stop()); cam.stream=null; }
  if(rafId){ cancelAnimationFrame(rafId); rafId=null; }
}

SCREENS.camera = {
  html(){
    if(!cam) initCam();
    return `
    <div class="cam">
      <div class="cam-stage" id="camStage">
        <video id="camVideo" playsinline autoplay muted></video>
        <div class="cam-fallback"></div>
        <canvas id="arCanvas"></canvas>
        <div class="ar-labels" id="arLabels"></div>
        <div class="scanline" id="scanline"></div>
        <div class="cam-hud" id="camHud"></div>
      </div>
      <div class="cam-panel" id="camPanel"></div>
    </div>`;
  },
  mount(){ mountCamera(); }
};

async function mountCamera(){
  cleanup = ()=>{ stopCamera(); };
  const video = $('#camVideo');
  const stage = $('#camStage');
  try{
    const stream = await navigator.mediaDevices.getUserMedia({
      video:{ facingMode:{ideal:'environment'}, width:{ideal:1920}, height:{ideal:1080} }, audio:false
    });
    cam.stream = stream;
    video.srcObject = stream;
    await video.play().catch(()=>{});
  }catch(e){
    stage.classList.add('nocam');
    toast('Kamera acilamadi, onizleme modu','warn');
  }
  cam.t0 = Date.now();
  cam.phase = 'searching';
  updateCamUI();
  arLoop();
  setTimeout(()=>{
    if(!cam) return;
    const p = S.products.find(x=>x.code==='BRK-125') || S.products[0];
    cam.product = p;
    cam.targetConf = 0.90 + Math.random()*0.09;
    animateConfidence();
  }, 2100);
}

function animateConfidence(){
  const tick = ()=>{
    if(!cam || !cam.product) return;
    if(cam.confidence < cam.targetConf){
      cam.confidence = Math.min(cam.targetConf, cam.confidence + 0.022 + Math.random()*0.02);
      updateCamUI();
      setTimeout(tick, 45);
    }else{
      const pct = Math.round(cam.confidence*100);
      cam.phase = pct >= S.settings.minConf ? 'detected' : 'lowconf';
      updateCamUI();
    }
  };
  tick();
}

function updateCamUI(){
  if(!cam) return;
  const hud = $('#camHud'); const panel = $('#camPanel'); const scan = $('#scanline');
  if(!hud || !panel) return;
  const pct = Math.round(cam.confidence*100);
  hud.innerHTML =
    '<div style="display:flex;flex-direction:column;gap:6px">' +
      '<span class="pill live"><span class="dot"></span>CANLI</span>' +
      '<span class="pill">' + esc(S.settings.plant) + '</span>' +
    '</div>' +
    '<div class="hud-r">' +
      (cam.calibrated?'<span class="pill acc">' + I.ruler + ' ' + cam.pxPerMM.toFixed(2) + ' px/mm</span>':'') +
      '<span class="pill ' + (S.settings.mockAI?'':'acc') + '">' + (S.settings.mockAI?'MOCK AI':'AI') + '</span>' +
    '</div>';
  if(cam.phase==='searching' || cam.phase==='measuring') scan.classList.add('on');
  else scan.classList.remove('on');
  const feats = cam.product ? cam.product.features : [];
  let okc=0, nokc=0, measc=0;
  feats.forEach(f=>{
    const m = cam.measurements[f.id];
    if(m){ measc++; const r=isOK(f,m.ai); if(r===true) okc++; else if(r===false) nokc++; }
  });
  const stepIdx = cam.phase==='searching'||cam.phase==='lowconf' ? 0 : (!cam.calibrated ? 1 : (cam.phase==='measured' ? 3 : 2));
  let body = '';
  if(cam.phase==='searching'){
    body = '<div class="steps">' + [0,1,2,3].map(i=>'<div class="st ' + (i===0?'act':'') + '"></div>').join('') + '</div>' +
      '<div style="font-size:14.5px;font-weight:750;margin-bottom:4px">Parca araniyor...</div>' +
      '<div class="small muted">AI goruntuyu analiz ediyor ve veritabanindaki urunlerle eslestiriyor.</div>' +
      '<div class="progress"><i style="width:' + Math.min(100,(Date.now()-cam.t0)/21) + '%"></i></div>';
  } else if(cam.phase==='lowconf'){
    body = '<div class="steps">' + [0,1,2,3].map(i=>'<div class="st ' + (i===0?'act':'') + '"></div>').join('') + '</div>' +
      '<div style="font-size:14.5px;font-weight:750;color:#fbbf24;margin-bottom:4px">Dusuk guven orani: %' + pct + '</div>' +
      '<div class="small muted" style="margin-bottom:12px">Lutfen parcayi farkli bir acidan gosterin veya manuel secin.</div>' +
      '<div class="row" style="gap:9px">' +
        '<button class="btn sm" style="flex:1" id="cam_retry">' + I.refresh + ' Tekrar Dene</button>' +
        '<button class="btn sm" style="flex:1" id="cam_manual">' + I.menu + ' Manuel Sec</button>' +
      '</div>';
  } else if(cam.phase==='detected'){
    body = '<div class="steps">' + [0,1,2,3].map(i=>'<div class="st ' + (i<=stepIdx?'done':'') + ' ' + (i===stepIdx?'act':'') + '"></div>').join('') + '</div>' +
      '<div class="row" style="margin-bottom:12px">' +
        '<div style="width:38px;height:38px;border-radius:11px;background:var(--surface3);display:flex;align-items:center;justify-content:center;color:var(--accent)">' + I.check + '</div>' +
        '<div style="flex:1;min-width:0"><div style="font-size:14px;font-weight:750">Urun tanindi</div><div class="tiny muted">Teknik resim ve kontrol plani yuklendi</div></div>' +
      '</div>' +
      '<div class="note info" style="margin-bottom:12px">' + I.ruler + '<div>Goruntu olcumu icin <b>' + S.settings.refMM + ' mm</b> referans mastarini parcanin yanina yerlestirin.</div></div>' +
      '<button class="btn primary" id="cam_calib">' + I.ruler + ' Referans Kalibrasyonu Yap</button>' +
      '<button class="btn" style="margin-top:9px" id="cam_manual">' + I.menu + ' Yanlis Urun - Manuel Sec</button>';
  } else if(cam.phase==='calibrating'){
    body = '<div class="steps">' + [0,1,2,3].map(i=>'<div class="st ' + (i<=1?'done':'') + ' ' + (i===1?'act':'') + '"></div>').join('') + '</div>' +
      '<div style="font-size:14.5px;font-weight:750;margin-bottom:4px">Referans taraniyor...</div>' +
      '<div class="small muted">' + S.settings.refMM + ' mm mastar algilaniyor, piksel/mm orani hesaplaniyor.</div>' +
      '<div class="progress"><i style="width:70%"></i></div>';
  } else if(cam.phase==='calibrated'){
    body = '<div class="steps">' + [0,1,2,3].map(i=>'<div class="st ' + (i<=1?'done':'') + ' ' + (i===1?'act':'') + '"></div>').join('') + '</div>' +
      '<div class="row" style="margin-bottom:12px">' +
        '<span class="badge ok">' + I.check + ' KALIBRE</span>' +
        '<span class="mono small muted">' + cam.pxPerMM.toFixed(2) + ' px/mm</span>' +
      '</div>' +
      '<div class="small muted" style="margin-bottom:12px">Referans bulundu. ' + feats.length + ' kontrol noktasi goruntu uzerine yerlestirildi.</div>' +
      '<button class="btn primary" id="cam_measure">' + I.scan + ' AI Goruntu Olcumunu Baslat</button>';
  } else if(cam.phase==='measuring'){
    body = '<div class="steps">' + [0,1,2,3].map(i=>'<div class="st ' + (i<=2?'done':'') + ' ' + (i===2?'act':'') + '"></div>').join('') + '</div>' +
      '<div style="font-size:14.5px;font-weight:750;margin-bottom:4px">AI olcum yapiyor...</div>' +
      '<div class="small muted">' + measc + '/' + feats.length + ' kontrol noktasi olculdu</div>' +
      '<div class="progress"><i style="width:' + (feats.length?measc/feats.length*100:0) + '%"></i></div>';
  } else if(cam.phase==='measured'){
    body = '<div class="steps">' + [0,1,2,3].map(i=>'<div class="st ' + (i<=3?'done':'') + ' ' + (i===3?'act':'') + '"></div>').join('') + '</div>' +
      '<div class="between" style="margin-bottom:10px">' +
        '<div style="font-size:14.5px;font-weight:750">Olcum tamamlandi</div>' +
        '<span class="badge ai">AI GORUNTU OLCUMU</span>' +
      '</div>' +
      '<div class="stats" style="grid-template-columns:repeat(3,1fr);margin-bottom:12px">' +
        '<div class="stat"><div class="v">' + feats.length + '</div><div class="k">Toplam</div></div>' +
        '<div class="stat ok"><div class="v">' + okc + '</div><div class="k">OK</div></div>' +
        '<div class="stat nok"><div class="v">' + nokc + '</div><div class="k">NOK</div></div>' +
      '</div>' +
      '<div class="tiny muted" style="margin-bottom:10px">Sonuclari gormek icin etiketlere dokunun. Kritik olculerde manuel cihaz degeri giriniz.</div>' +
      '<button class="btn primary" id="cam_finish">' + I.check + ' Kontrolu Tamamla</button>' +
      '<button class="btn" style="margin-top:9px" id="cam_remeasure">' + I.refresh + ' Yeniden Olc</button>';
  }
  panel.innerHTML = body;
  const bind=(id,fn)=>{ const el=$('#'+id); if(el) el.onclick=fn; };
  bind('cam_retry', ()=>{ cam.confidence=0; cam.targetConf=0.90+Math.random()*0.09; cam.phase='searching'; updateCamUI(); animateConfidence(); });
  bind('cam_manual', ()=> openProductPicker());
  bind('cam_calib', ()=> startCalibration());
  bind('cam_measure', ()=> runMeasurements());
  bind('cam_finish', ()=> go('result'));
  bind('cam_remeasure', ()=>{ cam.measurements={}; cam.phase='calibrated'; updateCamUI(); });
  updateLabels();
  drawScene();
}

function updateLabels(){
  const el = $('#arLabels');
  if(!el) return;
  if(!cam || !cam.product){ el.innerHTML=''; return; }
  const v = cam._view;
  if(!v){ el.innerHTML=''; return; }
  const p = cam.product;
  let html = '';
  p.features.forEach(f=>{
    const m = cam.measurements[f.id];
    let cls = 'ar-label';
    if(m){ cls += isOK(f,m.ai) ? ' ok' : ' nok'; }
    if(cam.selected===f.id) cls += ' sel';
    const cx = v.ox + f.ar.lx*v.k;
    const cy = v.oy + f.ar.ly*v.k;
    const x = Math.max(78, Math.min(v.W-78, cx));
    const y = Math.max(16, Math.min(v.H-16, cy));
    f._px = {x,y};
    html += '<button class="' + cls + '" data-arid="' + f.id + '" style="left:' + x + 'px;top:' + y + 'px">' +
      '<span class="ar-num">' + f.id + '</span>' +
      '<span>' + esc(f.display) + '</span>' +
      (m?'<span class="ar-val">' + fmtN(m.ai) + '</span>':'') +
    '</button>';
  });
  el.innerHTML = html;
  el.querySelectorAll('[data-arid]').forEach(b=>{
    b.onclick = (e)=>{ e.stopPropagation(); openFeatureSheet(Number(b.dataset.arid)); };
  });
}

function drawScene(){
  const stage = $('#camStage');
  if(!stage || !cam) return;
  const cv = $('#arCanvas');
  const W = stage.clientWidth, H = stage.clientHeight;
  if(!W || !H) return;
  const dpr = Math.min(window.devicePixelRatio||1, 2);
  cv.width = W*dpr; cv.height = H*dpr;
  cv.style.width = W+'px'; cv.style.height = H+'px';
  const ctx = cv.getContext('2d');
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.clearRect(0,0,W,H);
  if(cam.phase==='searching'){ drawGrid(ctx,W,H); return; }
  if(!cam.product) return;
  const G = cam.product.geom;
  let pw = W*0.78;
  let ph = pw*(G.H/G.W);
  const maxH = H*0.44;
  if(ph > maxH){ ph = maxH; pw = ph*(G.W/G.H); }
  const k = pw/G.W;
  const ox = W/2 - pw/2;
  const oy = H*0.50 - ph/2;
  cam._view = {ox,oy,k,pw,ph,W,H};
  cam.pxPerMM = k;
  if(S.settings.showSynthetic){
    ctx.save();
    ctx.shadowColor = 'rgba(0,209,178,.45)';
    ctx.shadowBlur = 22;
    roundRect(ctx, ox, oy, pw, ph, Math.min(G.R*k, ph/2));
    const grad = ctx.createLinearGradient(ox, oy, ox+pw, oy+ph);
    grad.addColorStop(0,'rgba(158,178,196,.50)');
    grad.addColorStop(.45,'rgba(112,132,152,.38)');
    grad.addColorStop(1,'rgba(72,92,112,.52)');
    ctx.fillStyle = grad; ctx.fill();
    ctx.restore();
    ctx.strokeStyle = 'rgba(0,209,178,.85)';
    ctx.lineWidth = 2;
    roundRect(ctx, ox, oy, pw, ph, Math.min(G.R*k, ph/2));
    ctx.stroke();
    G.holes.forEach(h=>{
      ctx.beginPath();
      ctx.arc(ox+h.x*k, oy+h.y*k, (h.d/2)*k, 0, Math.PI*2);
      ctx.fillStyle = 'rgba(6,10,14,.94)';
      ctx.fill();
      ctx.strokeStyle='rgba(0,209,178,.7)'; ctx.lineWidth=1.6; ctx.stroke();
    });
    drawCorners(ctx, ox, oy, pw, ph);
  }
  cam.product.features.forEach(f=>{
    if(!f._px) return;
    const ax = ox + f.ar.x*k, ay = oy + f.ar.y*k;
    const m = cam.measurements[f.id];
    const r = m ? isOK(f,m.ai) : null;
    ctx.beginPath();
    ctx.moveTo(ax, ay);
    ctx.lineTo(f._px.x, f._px.y);
    ctx.strokeStyle = r===false ? 'rgba(239,68,68,.75)' : r===true ? 'rgba(34,197,94,.6)' : 'rgba(0,209,178,.5)';
    ctx.lineWidth = 1.2;
    ctx.setLineDash([4,4]);
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.beginPath();
    ctx.arc(ax, ay, 3.2, 0, Math.PI*2);
    ctx.fillStyle = r===false ? '#ef4444' : r===true ? '#22c55e' : '#00d1b2';
    ctx.fill();
    ctx.beginPath();
    ctx.arc(ax, ay, 7, 0, Math.PI*2);
    ctx.strokeStyle = r===false ? 'rgba(239,68,68,.5)' : 'rgba(0,209,178,.4)';
    ctx.lineWidth = 1.2; ctx.stroke();
  });
}

function roundRect(ctx,x,y,w,h,r){
  r = Math.min(r, w/2, h/2);
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.lineTo(x+w-r,y); ctx.quadraticCurveTo(x+w,y,x+w,y+r);
  ctx.lineTo(x+w,y+h-r); ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  ctx.lineTo(x+r,y+h); ctx.quadraticCurveTo(x,y+h,x,y+h-r);
  ctx.lineTo(x,y+r); ctx.quadraticCurveTo(x,y,x+r,y);
  ctx.closePath();
}
function drawCorners(ctx,x,y,w,h){
  const L = 22;
  ctx.strokeStyle='rgba(0,209,178,.95)'; ctx.lineWidth=2.6; ctx.lineCap='round';
  const pts = [[x,y,1,1],[x+w,y,-1,1],[x,y+h,1,-1],[x+w,y+h,-1,-1]];
  pts.forEach(p=>{
    const px=p[0], py=p[1], sx=p[2], sy=p[3];
    ctx.beginPath();
    ctx.moveTo(px+sx*L, py); ctx.lineTo(px, py); ctx.lineTo(px, py+sy*L);
    ctx.stroke();
  });
}
function drawGrid(ctx,W,H){
  ctx.strokeStyle='rgba(0,209,178,.09)'; ctx.lineWidth=1;
  const g=48;
  for(let x=0;x<W;x+=g){ ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,H); ctx.stroke(); }
  for(let y=0;y<H;y+=g){ ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(W,y); ctx.stroke(); }
}
function arLoop(){
  drawScene();
  updateLabels();
  rafId = requestAnimationFrame(arLoop);
}
function startCalibration(){
  cam.phase='calibrating';
  updateCamUI();
  setTimeout(()=>{
    const success = Math.random() > 0.15;
    if(success){
      const stage = $('#camStage');
      const W = stage ? stage.clientWidth : 360;
      cam.pxPerMM = (W*0.20) / S.settings.refMM;
      cam.calibrated = true;
      cam.refFound = true;
      cam.phase = 'calibrated';
      toast('Referans bulundu: ' + S.settings.refMM + '.00 mm -> ' + cam.pxPerMM.toFixed(2) + ' px/mm','ok');
    }else{
      cam.phase = 'detected';
      toast('Referans algilanamadi. Mastari net gosterin.','err');
    }
    updateCamUI();
  }, 2000);
}
function runMeasurements(){
  const feats = cam.product.features;
  cam.phase='measuring';
  cam.measurements = {};
  updateCamUI();
  const nokIdx = Math.floor(Math.random()*feats.length);
  feats.forEach((f,i)=>{
    setTimeout(()=>{
      cam.measurements[f.id] = { ai: mockMeasure(f, i===nokIdx), manual:null };
      updateCamUI();
    }, 200*(i+1));
  });
  setTimeout(()=>{
    cam.phase='measured';
    updateCamUI();
  }, 200*feats.length + 500);
}
function mockMeasure(f, forceNOK){
  if(f.type==='Yuzey'){
    const base = f.nominal;
    return +( forceNOK ? base*(1.4) : base*(0.92+Math.random()*0.2) ).toFixed(1);
  }
  const tol = f.tolP || 0.1;
  let dev;
  if(forceNOK){
    const sign = Math.random()<0.5?-1:1;
    dev = sign * tol * (1.15 + Math.random()*0.9);
  }else{
    dev = (Math.random()*2-1) * tol * 0.85;
  }
  return +(f.nominal + dev).toFixed(2);
}
function openFeatureSheet(fid){
  if(!cam || !cam.product) return;
  const f = cam.product.features.find(x=>x.id===fid);
  if(!f) return;
  cam.selected = fid;
  updateLabels();
  const m = cam.measurements[fid];
  const aiVal = m ? m.ai : null;
  const manVal = m ? m.manual : null;
  const eff = manVal!=null ? manVal : aiVal;
  const r = isOK(f, eff);
  const root = $('#sheetRoot');
  root.innerHTML =
    '<div class="sheet-bg" id="shBg"></div>' +
    '<div class="sheet" id="shEl">' +
      '<div class="grab"></div>' +
      '<div class="between" style="margin-bottom:14px">' +
        '<div style="display:flex;align-items:center;gap:9px">' +
          '<span style="width:26px;height:26px;border-radius:50%;background:var(--accent);color:#04211c;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px">' + f.id + '</span>' +
          '<div><div style="font-size:15px;font-weight:750">' + esc(f.name) + '</div><div class="tiny muted">' + esc(f.type) + ' - ' + esc(f.method) + '</div></div>' +
        '</div>' +
        (f.critical?'<span class="badge nok">KRITIK</span>':'') +
      '</div>' +
      '<div class="card tight" style="margin-bottom:12px">' +
        '<div class="kv"><span class="k">Nominal</span><span class="v mono">' + esc(f.display) + '</span></div>' +
        '<div class="kv"><span class="k">Tolerans</span><span class="v mono">+' + f.tolP + ' / -' + f.tolM + ' ' + f.unit + '</span></div>' +
        '<div class="kv"><span class="k">Kontrol Metodu</span><span class="v">' + esc(f.method) + '</span></div>' +
        '<div class="kv"><span class="k">Kabul Araligi</span><span class="v mono">' + fmtN(f.nominal-f.tolM) + ' - ' + fmtN(f.nominal+f.tolP) + '</span></div>' +
      '</div>' +
      '<div class="card tight" style="margin-bottom:12px">' +
        '<div class="between" style="padding:6px 0">' +
          '<div><span class="badge ai">AI GORUNTU OLCUMU</span><div class="tiny muted" style="margin-top:4px">Tahmini deger</div></div>' +
          '<div class="mono" style="font-size:17px;font-weight:800;color:' + (aiVal!=null?(isOK(f,aiVal)?'#4ade80':'#f87171'):'var(--muted2)') + '">' + (aiVal!=null?fmtN(aiVal)+' '+f.unit:'-') + '</div>' +
        '</div>' +
        '<div style="border-top:1px solid rgba(35,48,62,.6);margin-top:8px;padding-top:12px">' +
          '<label class="fl">Manuel Olcum Degeri (' + esc(f.unit) + ')</label>' +
          '<input id="fs_manual" type="number" step="0.01" inputmode="decimal" value="' + (manVal!=null?manVal:'') + '" placeholder="CMM / kumpas / mikrometre sonucu">' +
        '</div>' +
      '</div>' +
      '<div class="card tight" style="margin-bottom:12px;text-align:center">' +
        '<div class="tiny muted" style="margin-bottom:4px">SONUC</div>' +
        '<div style="font-size:22px;font-weight:900;letter-spacing:1px;color:' + (r===true?'#4ade80':r===false?'#f87171':'var(--muted2)') + '">' + (r===true?'OK':r===false?'NOK':'OLCULMEDI') + '</div>' +
        (eff!=null?'<div class="tiny muted" style="margin-top:2px">Sapma: ' + (eff-f.nominal>=0?'+':'') + fmtN(eff-f.nominal,3) + ' ' + f.unit + '</div>':'') +
      '</div>' +
      '<button class="btn primary" id="fs_save">' + I.check + ' Kaydet</button>' +
    '</div>';
  requestAnimationFrame(()=>{
    $('#shBg').classList.add('show');
    $('#shEl').classList.add('show');
  });
  const close = ()=>{
    $('#shBg').classList.remove('show');
    $('#shEl').classList.remove('show');
    cam.selected = null;
    setTimeout(()=>{ root.innerHTML=''; updateLabels(); }, 300);
  };
  $('#shBg').onclick = close;
  $('#fs_save').onclick = ()=>{
    const v = $('#fs_manual').value;
    if(!cam.measurements[fid]) cam.measurements[fid] = { ai: mockMeasure(f,false), manual:null };
    cam.measurements[fid].manual = v===''||isNaN(Number(v)) ? null : Number(v);
    close();
    updateCamUI();
    toast('Olcum kaydedildi','ok');
  };
}
function openProductPicker(){
  const root = $('#sheetRoot');
  root.innerHTML =
    '<div class="sheet-bg" id="pkBg"></div>' +
    '<div class="sheet" id="pkEl">' +
      '<div class="grab"></div>' +
      '<div style="font-size:16px;font-weight:750;margin-bottom:4px">Urun Manuel Sec</div>' +
      '<div class="tiny muted" style="margin-bottom:14px">AI tanimasi yanlissa dogru urunu secin.</div>' +
      S.products.map(p=>'<div class="li" data-pick="' + p.id + '">' +
        '<div class="licon">' + I.box + '</div>' +
        '<div class="lbody"><div class="ltitle">' + esc(p.code) + ' - ' + esc(p.name) + '</div><div class="lsub">Rev ' + esc(p.rev) + '</div></div>' +
      '</div>').join('') +
    '</div>';
  requestAnimationFrame(()=>{
    $('#pkBg').classList.add('show'); $('#pkEl').classList.add('show');
  });
  const close=()=>{ $('#pkBg').classList.remove('show'); $('#pkEl').classList.remove('show'); setTimeout(()=>root.innerHTML='',300); };
  $('#pkBg').onclick=close;
  root.querySelectorAll('[data-pick]').forEach(el=>{
    el.onclick = ()=>{
      const p = getProduct(el.dataset.pick);
      cam.product = p;
      cam.confidence = 1;
      cam.phase = 'detected';
      cam.calibrated = false;
      cam.measurements = {};
      close();
      updateCamUI();
      toast('Urun secildi: ' + p.code,'ok');
    };
  });
}

        const decision = b.dataset.dec;

        const results = {};
        p.features.forEach(f=>{ if(cam.measurements[f.id]) results[f.id] = Object.assign({}, cam.measurements[f.id]); });
        const rec = {
          id:'INS-'+String(Date.now()).slice(-6),
          date: Date.now(),

          supplierId: p.supplierId,
          lot: ($('#rs_lot') && $('#rs_lot').value.trim()) || 'LOT-',

function drawingSVG(p){
  const G = p.geom || {W:150,H:60,R:10,holes:[]};
  const VB_W = 560, VB_H = 340;
  const areaX = 30, areaY = 24, areaW = 380, areaH = 200;
  const scale = Math.min(areaW/G.W, areaH/G.H);
  const pw = G.W*scale, ph = G.H*scale;
  const ox = areaX + (areaW - pw)/2;
  const oy = areaY + (areaH - ph)/2;
  const X = mm => ox + mm*scale;
  const Y = mm => oy + mm*scale;
  const holes = (G.holes||[]).map(h=>
    '<circle cx="' + X(h.x).toFixed(1) + '" cy="' + Y(h.y).toFixed(1) + '" r="' + (h.d/2*scale).toFixed(1) + '" fill="#0a1119" stroke="#5fd6c4" stroke-width="1.1"/>' +
    '<line x1="' + (X(h.x)-3).toFixed(1) + '" y1="' + Y(h.y).toFixed(1) + '" x2="' + (X(h.x)+3).toFixed(1) + '" y2="' + Y(h.y).toFixed(1) + '" stroke="#5fd6c4" stroke-width=".8"/>' +
    '<line x1="' + X(h.x).toFixed(1) + '" y1="' + (Y(h.y)-3).toFixed(1) + '" x2="' + X(h.x).toFixed(1) + '" y2="' + (Y(h.y)+3).toFixed(1) + '" stroke="#5fd6c4" stroke-width=".8"/>'
  ).join('');
  return '<svg viewBox="0 0 ' + VB_W + ' ' + VB_H + '" xmlns="http://www.w3.org/2000/svg" style="background:#0d141c;border-radius:8px">' +
    '<defs><pattern id="gp" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M20 0H0V20" fill="none" stroke="#182430" stroke-width=".6"/></pattern></defs>' +
    '<rect width="' + VB_W + '" height="' + VB_H + '" fill="url(#gp)" opacity=".6"/>' +
    '<rect x="' + ox + '" y="' + oy + '" width="' + pw + '" height="' + ph + '" rx="' + (G.R*scale).toFixed(1) + '" fill="#16202b" stroke="#7fd8c8" stroke-width="1.6"/>' +
    holes +
    '<text x="' + (X(0)) + '" y="' + (Y(G.H) + 20) + '" fill="#8fd8c9" font-size="10.5" font-family="monospace">' + G.W.toFixed(2) + '</text>' +
    '<text x="' + (X(G.W) + 5) + '" y="' + (Y(G.H/2)) + '" fill="#8fd8c9" font-size="10.5" font-family="monospace">' + G.H.toFixed(2) + '</text>' +
    '<g transform="translate(' + (VB_W-190) + ',' + (VB_H-108) + ')">' +
      '<rect x="0" y="0" width="180" height="98" fill="#111a24" stroke="#2a3a4a" stroke-width="1"/>' +
      '<line x1="0" y1="26" x2="180" y2="26" stroke="#2a3a4a"/>' +
      '<line x1="0" y1="50" x2="180" y2="50" stroke="#2a3a4a"/>' +
      '<line x1="0" y1="74" x2="180" y2="74" stroke="#2a3a4a"/>' +
      '<text x="8" y="17" fill="#e2eef7" font-size="12" font-weight="700" font-family="monospace">' + esc(p.code) + '</text>' +
      '<text x="8" y="41" fill="#7f97a8" font-size="10" font-family="monospace">' + esc(p.name) + '</text>' +
      '<text x="8" y="65" fill="#7f97a8" font-size="10" font-family="monospace">MALZ: ' + esc(p.material||'-') + '</text>' +
      '<text x="8" y="89" fill="#00d1b2" font-size="11" font-weight="700" font-family="monospace">REV ' + esc(p.rev) + '</text>' +
      '<text x="96" y="89" fill="#7f97a8" font-size="9" font-family="monospace">mm / ISO 2768-m</text>' +
    '</g>' +
  '</svg>';
}
